const TENT_INTERACTION_DISTANCE = 6;
const CAMP_FIRE_CLEARANCE = 2.8;

// Read the physical tent position in the shared globe frame, not a saved view rotation.
function ownTentDirection() {
  const own = campModels.get(localPlayerId);
  if (!own) return null;
  own.group.updateMatrix();
  return own.tent.position.clone().applyMatrix4(own.group.matrix).normalize();
}

function ownTentDistance() {
  const direction = ownTentDirection();
  if (!direction) return Infinity;
  const here = new THREE.Vector3(0, 1, 0).applyQuaternion(globeRotation.clone().invert());
  return here.distanceTo(direction) * GLOBE_RADIUS;
}

function pitchCamp() {
  if (minigames?.competitive) { showToast('Vote to return to camping before setting up camp.'); return; }
  if (isSleeping) return;
  if (player.userData.swimming) {
    showToast('Return to shore before placing or picking up your tent.');
    return;
  }
  standUp();
  walkingToTent = false;
  if (localCampState) {
    // Check distance before allowing pack-up (same distance as tent entry)
    if (ownTentDistance() > TENT_INTERACTION_DISTANCE) {
      showToast('Too far from tent to pack up. Return to your campsite first.');
      return;
    }
    localCampState = null;
    publishCampState();
    return;
  }
  const here = new THREE.Vector3(0, 1, 0).applyQuaternion(globeRotation.clone().invert()).multiplyScalar(GLOBE_RADIUS);
  const camps = Object.values(remoteCampStates).filter(Boolean);
  const nearby = camps.map(camp => ({ camp, distance: new THREE.Vector3(...camp.position).multiplyScalar(GLOBE_RADIUS).distanceTo(here) }))
    .filter(site => site.distance < 8).sort((a, b) => a.distance - b.distance)[0];
  const forward = new THREE.Vector3(Math.sin(playerFacing), 0, Math.cos(playerFacing)).applyQuaternion(globeRotation.clone().invert());
  const anchor = nearby ? nearby.camp.position : here.clone().addScaledVector(forward, 3.5).normalize().toArray();
  const basis = new THREE.Quaternion().setFromUnitVectors(new THREE.Vector3(0, 1, 0), new THREE.Vector3(...anchor));
  const localHere = here.clone().sub(new THREE.Vector3(...anchor).multiplyScalar(GLOBE_RADIUS)).applyQuaternion(basis.clone().invert());
  const occupied = camps.filter(c => JSON.stringify(c.position) === JSON.stringify(anchor)).map(c => c.tent);
  const firstAngle = Math.atan2(localHere.x, localHere.z) + Math.PI / 3;
  const preferred = nearby ? [localHere.x, localHere.z] : [Math.sin(firstAngle) * CAMP_FIRE_CLEARANCE, Math.cos(firstAngle) * CAMP_FIRE_CLEARANCE];
  const tent = findTentSpace(anchor, preferred, occupied, [localHere.x, localHere.z]);
  if (!tent) { showToast('This campsite is full. Move a little farther away to pitch.'); return; }
  localCampState = { position: anchor, tent, placedAt: roomNow(),
    style: tentStyle, color: tentColor.toString(16).padStart(6, '0'), sleeping: false };
  if (here.distanceTo(new THREE.Vector3(...anchor).multiplyScalar(GLOBE_RADIUS)) < 1.8) {
    for (let i = 0; i < 32; i++) {
      const angle = Math.atan2(localHere.x, localHere.z) + i * Math.PI / 16;
      const offset = [Math.sin(angle) * 2, Math.cos(angle) * 2];
      if ([...occupied, tent].some(t => Math.hypot(t[0] - offset[0], t[1] - offset[1]) < 1.6)) continue;
      const safe = campsitePoint(anchor, offset).normalize().applyQuaternion(globeRotation);
      globeRotation.premultiply(new THREE.Quaternion().setFromUnitVectors(safe, new THREE.Vector3(0, 1, 0)));
      break;
    }
  }
  publishCampState();
}

function campsitePoint(anchor, offset) {
  const basis = new THREE.Quaternion().setFromUnitVectors(new THREE.Vector3(0, 1, 0), new THREE.Vector3(...anchor));
  return new THREE.Vector3(offset[0], GLOBE_RADIUS, offset[1]).applyQuaternion(basis);
}

function findTentSpace(anchor, preferred, occupied, playerOffset = null) {
  const clear = offset => {
    if (Math.hypot(...offset) < CAMP_FIRE_CLEARANCE - 1e-6 || occupied.some(t => Math.hypot(t[0] - offset[0], t[1] - offset[1]) < 3)) return false;
    if (playerOffset && Math.hypot(playerOffset[0] - offset[0], playerOffset[1] - offset[1]) < 1.8) return false;
    const point = campsitePoint(anchor, offset).normalize().multiplyScalar(GLOBE_RADIUS);
    return !collidables.some(c => point.distanceTo(latLonToWorld(c.lat, c.lon)) < c.radius + 1.2);
  };
  if (clear(preferred)) return preferred;
  let best = null, distance = Infinity;
  for (let radius = CAMP_FIRE_CLEARANCE; radius <= 30; radius += 0.75) {
    for (let i = 0; i < 64; i++) {
      const angle = i * Math.PI / 32;
      const candidate = [Math.sin(angle) * radius, Math.cos(angle) * radius];
      const d = Math.hypot(candidate[0] - preferred[0], candidate[1] - preferred[1]);
      if (d < distance && clear(candidate)) { best = candidate; distance = d; }
    }
  }
  return best;
}

function syncCamps() {
  const states = Object.entries({ ...remoteCampStates, [localPlayerId]: localCampState })
    .filter(([, state]) => state).sort(([a, sa], [b, sb]) => sa.placedAt - sb.placedAt || (a < b ? -1 : a > b ? 1 : 0));
  const desired = new Map();
  const sites = new Map();
  let correctedOwn = false;
  
  // Clear and rebuild tent colliders
  tentColliders.length = 0;
  
  for (const [id, state] of states) {
      const siteKey = JSON.stringify(state.position);
      const occupied = sites.get(siteKey) || [];
      let tent = state.tent;
      if (occupied.some(t => Math.hypot(t[0] - tent[0], t[1] - tent[1]) < 3)) {
        tent = findTentSpace(state.position, tent, occupied);
        if (!tent) continue;
        if (id === localPlayerId) { localCampState.tent = tent; correctedOwn = true; }
      }
      const ownsFire = occupied.length === 0;
      occupied.push(tent);
      sites.set(siteKey, occupied);
      const key = JSON.stringify([state.position, tent, state.style, state.color]);
      let model = campModels.get(id);
      if (!model || model.key !== key) {
        if (model) disposeCampObject(model.group);
        model = buildCampModel({ ...state, tent }, state.position);
        model.key = key;
        campModels.set(id, model);
      }
      model.sleeping = state.sleeping;
      model.fireAnchor.visible = ownsFire;
      desired.set(id, model);
      
      // Add tent collider with style-specific radius (all tents, including own)
      model.group.updateMatrix();
      const tentWorldPos = model.tent.position.clone().applyMatrix4(model.group.matrix);
      const { lat, lon } = worldToLatLon(tentWorldPos);
      // Tent radii based on geometry * scale (1.25): aframe ~0.5, dome 0.8, cabin 0.7, tunnel 0.6
      const tentRadii = { aframe: 0.5, dome: 0.8, cabin: 0.7, tunnel: 0.6 };
      const isOwn = id === localPlayerId;
      tentColliders.push({ lat, lon, radius: tentRadii[state.style] || 0.7, isOwn });
  }
  for (const [id, model] of campModels) {
    if (!desired.has(id)) { disposeCampObject(model.group); campModels.delete(id); }
  }
  const own = campModels.get(localPlayerId);
  campGroup = own?.group || null;
  campPitched = !!own;
  document.getElementById('btn-pitch').style.borderColor = campPitched ? '#f0c040' : 'rgba(255,255,255,0.3)';
  // Toggle player backpack visibility based on camp state
  if (player.userData.pack) {
    player.userData.pack.visible = !campPitched;
    player.userData.packFlap.visible = !campPitched;
    player.userData.sleepingBag.visible = !campPitched;
  }
  if (correctedOwn) publishCampState();
  const connected = Object.keys(dataChannels).filter(id => dataChannels[id].readyState === 'open');
  if (sharedEnvironment && [localPlayerId, ...connected].sort()[0] === localPlayerId) {
    const rate = localCampState?.sleeping && connected.every(id => remoteCampStates[id]?.sleeping) ? 0.1 : 0.04;
    if (rate !== sharedEnvironment.rate) publishEnvironment({ rate });
  }
}

// Ground the whole object, including its orientation and geometry's bottom.
// When winter is enabled and terrain is below ice level, place on ice surface instead.
function groundCampObject(object, sink = 0) {
  globePivot.updateWorldMatrix(true, true);
  const direction = object.getWorldPosition(new THREE.Vector3()).normalize();
  const ray = new THREE.Raycaster(direction.clone().multiplyScalar(GLOBE_RADIUS + 10),
    direction.clone().negate(), 0, GLOBE_RADIUS * 3);
  const hit = ray.intersectObject(globe, false)[0];
  if (!hit) return;
  const parent = object.parent;
  // If winter is enabled and terrain is below ice, use ice surface instead
  let surfacePoint = hit.point.clone();
  let surfaceNormal = hit.face.normal.clone().transformDirection(globe.matrixWorld);
  if (winter.enabled && hit.point.length() < winter.iceRadius) {
    surfacePoint = direction.clone().multiplyScalar(winter.iceRadius);
    surfaceNormal = direction.clone();
  }
  const normal = surfaceNormal.applyQuaternion(parent.getWorldQuaternion(new THREE.Quaternion()).invert()).normalize();
  object.quaternion.premultiply(new THREE.Quaternion().setFromUnitVectors(new THREE.Vector3(0, 1, 0), normal));
  let bottom = 0;
  if (object.geometry) {
    // Use actual vertices: rotated logs and sleeping rolls have different support heights.
    const positions = object.geometry.attributes.position;
    const vertex = new THREE.Vector3();
    bottom = Infinity;
    for (let i = 0; i < positions.count; i++) {
      vertex.fromBufferAttribute(positions, i).multiply(object.scale).applyQuaternion(object.quaternion);
      bottom = Math.min(bottom, vertex.dot(normal));
    }
  }
  object.position.copy(parent.worldToLocal(surfacePoint)).addScaledVector(normal, -bottom - sink);
  object.updateMatrixWorld(true);
}

function buildCampModel(state, anchor) {
  const tentStyle = state.style;
  const tentColor = parseInt(state.color, 16);
  const campGroup = new THREE.Group();
  let campCoals, campFireGeo, campFireAlphas, campFireLifespan;
  let campSmokeGeo, campSmokeVelocities, campFireLight, campFireLight2;

  const tent = buildTent(tentStyle, tentColor);
  campGroup.add(tent);
  const angle = Math.atan2(state.tent[0], state.tent[1]);
  tent.position.set(state.tent[0], tent.position.y, state.tent[1]);
  tent.quaternion.premultiply(new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(0, 1, 0), angle + Math.PI));

  // Fireplace - ported from camping-sim (physics-based fire)
  const fireOffset = new THREE.Vector3(0, 0, 0);
  const fireAnchor = new THREE.Group();
  fireAnchor.position.copy(fireOffset);
  campGroup.add(fireAnchor);

  // A generous clickable area over the flames, independent of particle raycasting.
  const fireClickTarget = new THREE.Mesh(new THREE.SphereGeometry(0.8, 12, 8),
    new THREE.MeshBasicMaterial({ transparent: true, opacity: 0, depthWrite: false }));
  fireClickTarget.position.y = 0.4;
  fireAnchor.add(fireClickTarget);

  for (let i = 0; i < 14; i++) {
    const size = 0.08 + rng() * 0.12;
    const segments = 3 + Math.floor(rng() * 4);
    const rockGeo = new THREE.SphereGeometry(size, segments, segments);
    const shade = 0.25 + rng() * 0.25;
    const rockMat = new THREE.MeshStandardMaterial({
      color: new THREE.Color(shade + rng() * 0.05, shade, shade - rng() * 0.03),
      roughness: 0.8 + rng() * 0.2,
    });
    const rock = new THREE.Mesh(rockGeo, rockMat);
    const a = (i / 14) * Math.PI * 2 + (rng() - 0.5) * 0.3;
    const dist = 0.55 + rng() * 0.2;
    rock.position.set(Math.cos(a) * dist, 0, Math.sin(a) * dist);
    rock.scale.set(0.8 + rng() * 0.5, 0.4 + rng() * 0.4, 0.8 + rng() * 0.5);
    rock.rotation.set(rng() * 0.4, rng() * Math.PI, rng() * 0.4);
    rock.castShadow = true;
    rock.userData.needsRaycast = true;
    fireAnchor.add(rock);
  }

  for (let i = 0; i < 5; i++) {
    const logGeo = new THREE.CylinderGeometry(0.06, 0.08, 0.7, 5);
    const logMat = new THREE.MeshStandardMaterial({ color: 0x3d2810, roughness: 1.0 });
    const log = new THREE.Mesh(logGeo, logMat);
    const angle = (i / 5) * Math.PI * 2;
    log.position.set(Math.cos(angle) * 0.25, 0.08, Math.sin(angle) * 0.25);
    log.rotation.z = Math.PI / 2 - 0.2;
    log.rotation.y = angle;
    log.userData.needsRaycast = true;
    fireAnchor.add(log);
  }

  campCoals = [];
  for (let i = 0; i < 20; i++) {
    const size = 0.03 + rng() * 0.06;
    const coalGeo = new THREE.SphereGeometry(size, 4, 3);
    const coalMat = new THREE.MeshStandardMaterial({
      color: 0x1a0800,
      emissive: 0xff3300,
      emissiveIntensity: 0.3 + rng() * 0.7,
      roughness: 1.0,
    });
    const coal = new THREE.Mesh(coalGeo, coalMat);
    const angle = rng() * Math.PI * 2;
    const dist = rng() * 0.4;
    coal.position.set(Math.cos(angle) * dist, 0.05 + rng() * 0.1, Math.sin(angle) * dist);
    coal.scale.y = 0.4 + rng() * 0.4;
    coal.userData.needsRaycast = true;
    campCoals.push(coal);
    fireAnchor.add(coal);
  }

  // Fire particles
  campFireGeo = new THREE.BufferGeometry();
  const firePositions = new Float32Array(56 * 3);
  campFireAlphas = new Float32Array(56);
  campFireLifespan = new Float32Array(56);
  for (let i = 0; i < 56; i++) {
    respawnCampFireParticle(firePositions, i, true, campFireLifespan, campFireAlphas);
  }
  campFireGeo.setAttribute('position', new THREE.BufferAttribute(firePositions, 3));
  const fireParticleMat = new THREE.PointsMaterial({
    color: 0xff6600, size: 0.25, transparent: true, opacity: 0.8,
    blending: THREE.AdditiveBlending, depthWrite: false,
  });
  const fireParticles = new THREE.Points(campFireGeo, fireParticleMat);
  fireParticles.position.set(0, 0.2, 0);
  fireAnchor.add(fireParticles);

  // Smoke particles
  campSmokeGeo = new THREE.BufferGeometry();
  const smokePositions = new Float32Array(30 * 3);
  campSmokeVelocities = [];
  for (let i = 0; i < 30; i++) {
    smokePositions[i * 3] = (rng() - 0.5) * 0.3;
    smokePositions[i * 3 + 1] = 1.5 + rng() * 2;
    smokePositions[i * 3 + 2] = (rng() - 0.5) * 0.3;
    campSmokeVelocities.push({
      x: (rng() - 0.5) * 0.005,
      y: 0.01 + rng() * 0.015,
      z: (rng() - 0.5) * 0.005,
    });
  }
  campSmokeGeo.setAttribute('position', new THREE.BufferAttribute(smokePositions, 3));
  const smokeMat = new THREE.PointsMaterial({
    color: 0x888888, size: 0.4, transparent: true, opacity: 0.3, depthWrite: false,
  });
  const campSmoke = new THREE.Points(campSmokeGeo, smokeMat);
  campSmoke.position.set(0, 0.3, 0);
  fireAnchor.add(campSmoke);

  campFireLight = new THREE.PointLight(0xff6622, 2, 8);
  campFireLight.position.set(0, 0.8, 0);
  campFireLight.castShadow = true;
  fireAnchor.add(campFireLight);
  campFireLight2 = new THREE.PointLight(0xff4400, 1, 5);
  campFireLight2.position.set(0.2, 0.5, 0.1);
  fireAnchor.add(campFireLight2);

  // Keep layout in the same radial frame used by campsitePoint and colliders.
  // Each object gets its own terrain height/slope instead of inheriting the fire's slope.
  campGroup.position.set(...anchor).multiplyScalar(GLOBE_RADIUS);
  campGroup.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), new THREE.Vector3(...anchor));
  globePivot.add(campGroup);
  groundCampObject(fireAnchor);
  groundCampObject(tent, tent.userData.groundSink || 0);
  for (const child of fireAnchor.children) {
    if (child.userData.needsRaycast) groundCampObject(child, 0.02);
  }

  // Placed gear (backpack and sleeping bag) near tent
  const gearGroup = new THREE.Group();
  const placedPack = new THREE.Mesh(
    new THREE.BoxGeometry(0.28, 0.32, 0.18),
    new THREE.MeshStandardMaterial({ color: 0x3d6b35, roughness: 0.8 })
  );
  placedPack.position.set(0.08, 0.16, 0);
  placedPack.castShadow = true;
  placedPack.userData.needsRaycast = true;
  gearGroup.add(placedPack);
  
  const placedFlap = new THREE.Mesh(
    new THREE.BoxGeometry(0.26, 0.06, 0.16),
    new THREE.MeshStandardMaterial({ color: 0x2d5528, roughness: 0.8 })
  );
  placedFlap.position.set(0, 0.16, 0);
  placedPack.add(placedFlap);
  
  const placedBag = new THREE.Mesh(
    new THREE.CylinderGeometry(0.07, 0.07, 0.28, 8),
    new THREE.MeshStandardMaterial({ color: 0x4488aa, roughness: 0.7 })
  );
  placedBag.position.set(-0.3, 0.07, 0);
  placedBag.rotation.z = Math.PI / 2;
  placedBag.castShadow = true;
  placedBag.userData.needsRaycast = true;
  gearGroup.add(placedBag);
  
  // Outside the front wall, toward the fire, slightly aside from the entrance.
  const tentPos = tent.position.clone();
  const towardFire = new THREE.Vector3(-state.tent[0], 0, -state.tent[1]).normalize();
  const side = new THREE.Vector3(towardFire.z, 0, -towardFire.x);
  gearGroup.position.copy(tentPos).addScaledVector(towardFire, 1.25).addScaledVector(side, 0.55);
  gearGroup.quaternion.setFromAxisAngle(new THREE.Vector3(0, 1, 0), angle + Math.PI);
  campGroup.add(gearGroup);
  
  // Raycast gear to terrain
  for (const child of gearGroup.children) {
    if (!child.userData.needsRaycast) continue;
    groundCampObject(child, 0.01);
  }

  return { group: campGroup, tent, fireAnchor, fireClickTarget, gearGroup, campCoals, campFireGeo, campFireAlphas,
    campFireLifespan, campSmokeGeo, campSmokeVelocities, campFireLight, campFireLight2,
    zTimer: 4.5, zSprites: [], sleeping: state.sleeping };
}

// Sleep state
let walkingToTent = false;
let walkingToFire = null;

function clearMovementInput() {
  minigames?.setVacuum(false);
  winter.stop();
  for (const key of Object.keys(keys)) delete keys[key];
  leverActive = false;
  leverTouchId = null;
  leverX = leverY = 0;
  leverZone.style.transform = '';
  playerBounceState = null;
}

function standUp() {
  if (sittingFireId !== null) {
    for (const limb of ['leftLeg', 'rightLeg', 'leftArm', 'rightArm']) player.userData[limb].rotation.x = 0;
    resetSwimLimbs(player);
  }
  sittingFireId = null;
  walkingToFire = null;
  document.getElementById('btn-stand').style.display = 'none';
}
document.getElementById('btn-stand').addEventListener('click', standUp);

function fireDirection(id) {
  const model = campModels.get(id);
  if (!model?.fireAnchor.visible) return null;
  model.group.updateMatrix();
  return model.fireAnchor.position.clone().applyMatrix4(model.group.matrix).normalize();
}

const campInteraction = document.getElementById('camp-interaction');
const standButton = document.getElementById('btn-stand');
campInteraction.style.transition = standButton.style.transition = 'opacity 0.5s ease';
let lastCampPromptActivity = performance.now();
let previousRestState = null;
let previousPromptView = null;
document.addEventListener('pointermove', () => { lastCampPromptActivity = performance.now(); }, { passive: true });

function nearbyCampInteraction() {
  if (minigamesOpen || walkingToTent || walkingToFire) return null;
  const activity = minigames?.interaction();
  if (activity) return activity;
  if (minigames?.competitive) return null;
  const candidates = [];
  const here = new THREE.Vector3(0, 1, 0).applyQuaternion(globeRotation.clone().invert());
  camera.updateMatrixWorld();
  for (const [id, model] of campModels) {
    model.group.updateMatrix();
    const objects = [];
    if (id === localPlayerId && sittingFireId === null) objects.push({ object: model.tent, type: 'tent', height: 1.5, range: 2.5 });
    if (!isSleeping && model.fireAnchor.visible && (sittingFireId === null || sittingFireId === id)) {
      objects.push({ object: model.fireAnchor, type: 'fire', height: 1.2, range: 2.3 });
    }
    for (const item of objects) {
      const point = item.object.position.clone().applyMatrix4(model.group.matrix);
      const direction = point.clone().normalize();
      const distance = here.distanceTo(direction) * GLOBE_RADIUS;
      if (distance > item.range) continue;
      const world = point.addScaledVector(direction, item.height).applyQuaternion(globeRotation);
      const screen = world.clone().project(camera);
      if (screen.z < -1 || screen.z > 1 || Math.abs(screen.x) > 0.95 || Math.abs(screen.y) > 0.95) continue;
      const toHint = world.clone().sub(camera.position);
      const ray = new THREE.Raycaster(camera.position, toHint.clone().normalize(), 0, toHint.length());
      if (ray.intersectObject(globe, false).length) continue;
      candidates.push({ id, type: item.type, distance, screen });
    }
  }
  return candidates.sort((a, b) => a.distance - b.distance)[0] || null;
}

function interactWithCamp(allowPitch = true) {
  if (minigamesOpen || walkingToTent || walkingToFire) return;
  if (minigames?.interact()) return;
  if (minigames?.competitive) return;
  if (isSleeping) { wakeUp(); return; }
  const target = nearbyCampInteraction();
  if (target?.type === 'tent') {
    standUp(); clearMovementInput(); walkingToTent = true;
  } else if (target?.type === 'fire') {
    walkToCampfire(target.id);
  } else if (sittingFireId !== null) {
    standUp();
  } else if (!isSleeping && allowPitch) {
    pitchCamp();
  }
}
campInteraction.addEventListener('click', interactWithCamp);

function updateCampInteraction() {
  const now = performance.now();
  const restState = isSleeping ? 'tent' : sittingFireId;
  const view = [cameraAngle, cameraHeight, cameraDistance];
  if (restState !== previousRestState || !previousPromptView ||
      view.some((value, i) => Math.abs(value - previousPromptView[i]) > 0.0001)) {
    lastCampPromptActivity = now;
  }
  previousRestState = restState;
  previousPromptView = view;
  const showPrompt = restState === null || now - lastCampPromptActivity < 2200;
  for (const element of [campInteraction, standButton]) {
    element.style.opacity = showPrompt ? '1' : '0';
    element.style.pointerEvents = showPrompt ? 'auto' : 'none';
  }
  const target = nearbyCampInteraction();
  campInteraction.style.display = target ? 'block' : 'none';
  // E is now for interaction, T is for pack/place - hint always visible
  document.getElementById('hint-pitch').style.display = lastInputMode === 'touch' ? 'none' : 'block';
  if (!target) return;
  const key = lastInputMode === 'gamepad' ? 'A' : lastInputMode === 'touch' ? 'Tap' : 'E';
  const action = target.type === 'minigame' ? target.action : target.type === 'tent' ? (isSleeping ? 'Wake up' : 'Enter tent') : (sittingFireId !== null ? 'Stand up' : 'Sit by fire');
  campInteraction.textContent = lastInputMode === 'touch' ? action : `${key} · ${action}`;
  campInteraction.style.left = `${(target.screen.x * 0.5 + 0.5) * window.innerWidth}px`;
  campInteraction.style.top = `${(-target.screen.y * 0.5 + 0.5) * window.innerHeight}px`;
}

function walkToCampfire(id) {
  if (minigames?.competitive) return;
  if (isSleeping) return;
  if (sittingFireId !== null) { standUp(); return; }
  const center = fireDirection(id);
  if (!center) return;
  const here = new THREE.Vector3(0, 1, 0).applyQuaternion(globeRotation.clone().invert());
  const basis = new THREE.Quaternion().setFromUnitVectors(new THREE.Vector3(0, 1, 0), center);
  const localHere = here.clone().applyQuaternion(basis.clone().invert());
  const preferredAngle = Math.atan2(localHere.x, localHere.z);
  // Pick a dry, clear seat around the nearest side of the fire.
  for (const radius of [1.6, 2.1]) {
    for (let i = 0; i < 24; i++) {
      const angle = preferredAngle + (i % 2 ? 1 : -1) * Math.ceil(i / 2) * Math.PI / 12;
      const direction = new THREE.Vector3(Math.sin(angle) * radius, GLOBE_RADIUS, Math.cos(angle) * radius)
        .applyQuaternion(basis).normalize();
      const point = direction.clone().multiplyScalar(GLOBE_RADIUS);
      if ([...collidables, ...tentColliders].some(c => point.distanceTo(latLonToWorld(c.lat, c.lon)) < c.radius + 0.65)) continue;
      if (Object.values(otherPlayers).some(p => p.mesh.visible && point.distanceTo(
        new THREE.Vector3(0, GLOBE_RADIUS, 0).applyQuaternion(p.currentGlobeRotation.clone().invert())) < 0.85)) continue;
      globePivot.updateWorldMatrix(true, true);
      const worldDir = direction.clone().applyQuaternion(globeRotation);
      const ray = new THREE.Raycaster(worldDir.clone().multiplyScalar(GLOBE_RADIUS + 10), worldDir.clone().negate());
      const hit = ray.intersectObject(globe, false)[0];
      if (!hit || hit.point.length() < WATER_RADIUS + 0.05) continue;
      walkingToTent = false;
      clearMovementInput();
      walkingToFire = { id, direction };
      return;
    }
  }
  showToast('No clear, dry seat here. Try another side of the fire.');
}

function applySitPose(mesh) {
  mesh.position.addScaledVector(mesh.position.clone().normalize(), -0.28);
  const s = mesh.userData;
  s.leftLeg.rotation.set(-Math.PI / 2, 0, 0.22);
  s.rightLeg.rotation.set(-Math.PI / 2, 0, -0.22);
  s.leftArm.rotation.set(-0.75, 0, 0.2);
  s.rightArm.rotation.set(-0.75, 0, -0.2);
}
const tapRaycaster = new THREE.Raycaster();
const tapMouse = new THREE.Vector2();
let lastMouseDownPos = null;
let lastMouseDownTime = 0;

renderer.domElement.addEventListener('pointerdown', (e) => {
  if (e.button !== 0) return;
  if (!e.isPrimary) { if (lastMouseDownPos) lastMouseDownPos.dragged = true; return; }
  lastMouseDownPos = { x: e.clientX, y: e.clientY, id: e.pointerId, dragged: false };
  lastMouseDownTime = performance.now();
}, true);
renderer.domElement.addEventListener('pointermove', e => {
  if (lastMouseDownPos?.id === e.pointerId && Math.hypot(e.clientX - lastMouseDownPos.x, e.clientY - lastMouseDownPos.y) > 10) lastMouseDownPos.dragged = true;
});
renderer.domElement.addEventListener('pointercancel', () => { if (lastMouseDownPos) lastMouseDownPos.dragged = true; });

renderer.domElement.addEventListener('click', (e) => {
  if (e.button !== 0) return;
  if (minigames?.competitive) return;
  const ownModel = campModels.get(localPlayerId);
  
  // Ignore if this was a drag (moved more than 10px or held longer than 300ms)
  if (lastMouseDownPos) {
    const dx = e.clientX - lastMouseDownPos.x;
    const dy = e.clientY - lastMouseDownPos.y;
    const dist = Math.sqrt(dx * dx + dy * dy);
    const duration = performance.now() - lastMouseDownTime;
    if (lastMouseDownPos.dragged || dist > 10 || duration > 500) return;
  }
  // Clicks and taps fire through the center crosshair, never toward the pointer.
  if (winter.holding) { winter.action(); return; }
  
  tapMouse.x = (e.clientX / window.innerWidth) * 2 - 1;
  tapMouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
  tapRaycaster.setFromCamera(tapMouse, camera);
  
  const targets = ownModel ? [ownModel.tent] : [];
  const fires = new Map();
  if (!isSleeping) {
    for (const [id, model] of campModels) {
      if (!model.fireAnchor.visible) continue;
      targets.push(model.fireClickTarget);
      fires.set(model.fireClickTarget, id);
    }
  }
  const hits = tapRaycaster.intersectObjects(targets, false);
  const hit = hits[0];
  if (!hit) { winter.interact(tapRaycaster); return; }
  // Ignore camps hidden behind terrain on the far side of the planet.
  const terrainHit = tapRaycaster.intersectObject(globe, false)[0];
  if (terrainHit && terrainHit.distance < hit.distance - 0.05) { winter.interact(tapRaycaster); return; }
  if (fires.has(hit.object)) {
    walkToCampfire(fires.get(hit.object));
  } else {
    if (isSleeping) {
      wakeUp();
    } else {
      standUp();
      walkingToTent = true;
    }
  }
});

function enterTent() {
  if (minigames?.competitive) return;
  standUp();
  clearMovementInput();
  isSleeping = true;
  walkingToTent = false;
  flashlightOn = false;
  flashlight.intensity = 0;
  player.userData.flashlightStick.visible = false;
  document.getElementById('btn-flashlight').style.borderColor = 'rgb(240 192 64 / 0%)';
  player.visible = false;
  document.getElementById('controls-row').style.opacity = '0.3';
  document.getElementById('controls-row').style.pointerEvents = 'none';
  if (localCampState) { localCampState.sleeping = true; publishCampState(); }
}

function makeZSprite(size, xOffset) {
  const canvas = document.createElement('canvas');
  canvas.width = 64; canvas.height = 64;
  const ctx = canvas.getContext('2d');
  ctx.font = `bold ${40 + size * 10}px sans-serif`;
  ctx.fillStyle = '#0000ff';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText('Z', 32, 32);
  const tex = new THREE.CanvasTexture(canvas);
  const mat = new THREE.SpriteMaterial({ map: tex, transparent: true, opacity: 1, depthWrite: false });
  const sprite = new THREE.Sprite(mat);
  sprite.scale.set(0.3 + size * 0.15, 0.3 + size * 0.15, 1);
  sprite.userData.xOffset = xOffset;
  sprite.userData.xDrift = (Math.random() - 0.5) * 0.15;
  return sprite;
}

function wakeUp() {
  clearMovementInput();
  isSleeping = false;
  player.visible = true;
  document.getElementById('controls-row').style.opacity = '';
  document.getElementById('controls-row').style.pointerEvents = '';
  if (localCampState) {
    localCampState.sleeping = false;
    publishCampState();
    // Move player to just outside the tent entrance
    const anchor = new THREE.Vector3(...localCampState.position);
    const tentOffset = localCampState.tent;
    const tentAngle = Math.atan2(tentOffset[0], tentOffset[1]);
    // Exit 1.5 units in front of tent toward campsite center
    const exitDistance = 1.5;
    let exitOffset = [
      tentOffset[0] - Math.sin(tentAngle) * exitDistance,
      tentOffset[1] - Math.cos(tentAngle) * exitDistance
    ];
    let exitDist = Math.hypot(exitOffset[0], exitOffset[1]);
    // Fire ring is ~0.55 radius. If exit would land inside it, push out to safe distance
    const fireRingRadius = 0.8;
    if (exitDist < fireRingRadius) {
      // Place player just outside fire ring, on the line from center through tent
      exitOffset = [Math.sin(tentAngle) * fireRingRadius, Math.cos(tentAngle) * fireRingRadius];
      exitDist = fireRingRadius;
    }
    const basis = new THREE.Quaternion().setFromUnitVectors(new THREE.Vector3(0, 1, 0), anchor);
    const exitPoint = new THREE.Vector3(exitOffset[0], GLOBE_RADIUS, exitOffset[1]).applyQuaternion(basis).normalize();
    const exitGlobeRot = globeRotation.clone().premultiply(
      new THREE.Quaternion().setFromUnitVectors(exitPoint.clone().applyQuaternion(globeRotation), new THREE.Vector3(0, 1, 0))
    );
    globeRotation.copy(exitGlobeRot);
    // Face toward campsite center (fire), but don't snap camera
    playerFacing = tentAngle + Math.PI;
  }
}

document.getElementById('btn-pitch').addEventListener('touchstart', (e) => {
  e.preventDefault();
  pitchCamp();
});

function updateDayNight(delta) {
  const hour = timeOfDay;

  // Continuous orbit with a soft horizon fade for the miniature globe.
  const sunAngle = (hour - 6) / 24 * Math.PI * 2;
  const orbitRadius = 40;
  const sunX = Math.cos(sunAngle) * orbitRadius;
  const sunY = GLOBE_RADIUS + Math.sin(sunAngle) * orbitRadius;
  const sunZ = 0;

  sun.position.set(sunX, sunY, sunZ);
  sun.target.position.set(0, GLOBE_RADIUS, 0);
  sunSphere.position.set(sunX * 3, GLOBE_RADIUS + Math.sin(sunAngle) * orbitRadius * 3, 0);
  sunSphere.scale.setScalar(3);

  // Moon is opposite the sun
  moon.position.set(-sunX, GLOBE_RADIUS + Math.sin(sunAngle + Math.PI) * orbitRadius, 0);
  moon.target.position.set(0, GLOBE_RADIUS, 0);
  moonSphere.position.set(-sunX * 3, GLOBE_RADIUS - Math.sin(sunAngle) * orbitRadius * 3, 0);
  moonSphere.scale.setScalar(3);

  // Intensity based on altitude
  const { sunAltitude, daylight, twilight, skyColor } = skyLighting(timeOfDay, winter.enabled);
  const snowy = winter.snowy;
  seasonalSky.update({ rotation: globeRotation, playerPosition: player.position, winter: winter.enabled,
    skyColor, daylight, twilight, sunAltitude, time: (roomNow() / 1000) % 86400 });
  sun.color.setHex(snowy ? 0xffffff : 0xfff4e0);
  sunSphere.material.color.setHex(snowy ? 0xf3f4f5 : 0xffee88);
  hemi.groundColor.setHex(snowy ? 0xa6adb3 : 0x446622);
  sun.intensity = 1.2 * THREE.MathUtils.smoothstep(sunAltitude, -0.03, 0.2);
  moon.intensity = (0.2 + moonlightStrength * 0.3) * (1 - THREE.MathUtils.smoothstep(sunAltitude, -0.2, 0.08));
  sunSphere.material.opacity = THREE.MathUtils.smoothstep(sunAltitude, -0.02, 0.12);
  moonSphere.material.opacity = THREE.MathUtils.smoothstep(-sunAltitude, -0.02, 0.12);

  scene.background = skyColor;
  ambient.intensity = THREE.MathUtils.lerp(0.05 + moonlightStrength * 0.15, 0.3, daylight);
  hemi.intensity = THREE.MathUtils.lerp(0.05 + moonlightStrength * 0.1, 0.6, daylight);

  if (fogDensity > 0) {
    scene.fog = new THREE.FogExp2(skyColor, fogDensity * 0.15);
  } else {
    scene.fog = null;
  }

  // Recharge only inside our pitched tent, never merely within interaction range.
  const atTent = isSleeping && !!localCampState && campModels.has(localPlayerId);
  if (flashlightOn) {
    flashlightBattery = Math.max(0, flashlightBattery - delta / FLASHLIGHT_DRAIN_TIME);
  } else if ((atTent || minigames?.night) && flashlightBattery < 1) {
    flashlightBattery = Math.min(1, flashlightBattery + delta / FLASHLIGHT_RECHARGE_TIME);
  }
  if (flashlightBattery <= 0) flashlightOn = false;
  flashlightBatteryRing.style.strokeDashoffset = (1 - flashlightBattery) * flashlightRingLength;
  flashlightBatteryRing.style.stroke = flashlightOn ? '#f0c040' :
    (flashlightBattery < 0.2 ? '#ff4444' : '#ddd');
  const torchOn = flashlightOn && !isSleeping && player.visible && flashlightBattery > 0;
  
  flashlight.intensity = torchOn ? 15 : 0;
  player.userData.flashlightStick.visible = torchOn;
  player.userData.flashlightLens.material.color.setHex(torchOn ? 0xffffcc : 0x333333);
  if (torchOn) {
    const stickWorld = new THREE.Vector3();
    player.userData.flashlightLens.getWorldPosition(stickWorld);
    flashlight.position.copy(stickWorld);
    flashlight.target.position.set(
      Math.sin(playerFacing) * 5,
      player.position.y - 0.5,
      Math.cos(playerFacing) * 5
    );
    if (isFirstPerson()) flashlight.target.position.copy(flashlight.position).addScaledVector(camera.getWorldDirection(new THREE.Vector3()), 5);
  }

  // Local player name label
  localNameLabel.visible = showNameLabels && !isFirstPerson();
  if (localNameLabel.visible) {
    if (isSleeping) {
      const ownCamp = campModels.get(localPlayerId);
      if (ownCamp?.tent) {
        const tentWorld = new THREE.Vector3();
        ownCamp.tent.getWorldPosition(tentWorld);
        localNameLabel.position.copy(tentWorld).add(new THREE.Vector3(0, -0.5, 0));
      }
    } else {
      localNameLabel.position.set(0, player.position.y - 0.3, 0);
    }
    // Clamp scale based on distance to camera
    const dist = camera.position.distanceTo(localNameLabel.position);
    const baseScale = 0.4;
    const scale = Math.max(0.75, Math.min(1.5, dist * 0.15)) * baseScale;
    localNameLabel.scale.set(scale * 3, scale * 0.75, 1);
  }

  // Star visibility and winter cloud occlusion are handled by seasonalSky.

  // Fireflies visible at dusk/night, but not in winter
  const fireflyVisibility = winter.enabled ? 0 : 1 - THREE.MathUtils.smoothstep(sunAltitude, -0.1, 0.15);
  fireflyMat.opacity = fireflyVisibility;
}

// --- ANIMATION ---
const clock = new THREE.Clock();
const globeRotation = new THREE.Quaternion();
globeRotation.setFromAxisAngle(new THREE.Vector3(1, 0, 0), -0.6);
window.globeRotation = globeRotation;

// Restore position and camp from previous session if rejoining same room
const savedSession = loadSession();
if (savedSession && savedSession.roomId === roomId && savedSession.globeRotation) {
  globeRotation.set(savedSession.globeRotation.x, savedSession.globeRotation.y, savedSession.globeRotation.z, savedSession.globeRotation.w);
  if (typeof savedSession.cameraAngle === 'number') {
    cameraAngle = savedSession.cameraAngle;
    cameraTargetAngle = savedSession.cameraAngle;
  }
  if (savedSession.campState) {
    localCampState = savedSession.campState;
    publishCampState();
    if (localCampState.sleeping) {
      enterTent();
    }
  }
  // Weather was restored from the room server before game initialization.
  // A browser's old session must never overwrite the current room environment.
  // Restore team scores from session (for solo play persistence)
  if (savedSession.teamScores) {
    teamScores = { ...savedSession.teamScores };
    if (sharedEnvironment) sharedEnvironment.teamScores = { ...teamScores };
    updateTeamLeaderboard();
  }
}

function animate() {
  requestAnimationFrame(animate);
  clock.getDelta();
  const frameTime = clock.elapsedTime - (animate._lastFrame || 0);
  if (frameTime < 1/30) return;
  animate._lastFrame = clock.elapsedTime;
  const delta = Math.min(frameTime, 0.1);
  stars.rotation.y += delta * 0.003;

  // Gamepad input
  let gamepadMoveY = 0, gamepadMoveX = 0, gamepadLookX = 0, gamepadLookY = 0;
  let gamepadA = false, gamepadB = false, gamepadY = false;
  let gamepadDpadUp = false, gamepadDpadDown = false;
  let gamepadX = false, gamepadMenu = false;
  let gamepadDpadLeft = false, gamepadDpadRight = false;
  const gamepads = navigator.getGamepads ? navigator.getGamepads() : [];
  for (const gp of gamepads) {
    if (!gp) continue;
    gamepadConnected = true;
    // Left stick: axes[0]=X, axes[1]=Y (with deadzone)
    const lx = Math.abs(gp.axes[0]) > 0.15 ? gp.axes[0] : 0;
    const ly = Math.abs(gp.axes[1]) > 0.15 ? gp.axes[1] : 0;
    // Right stick: axes[2]=X, axes[3]=Y (with deadzone)
    const rx = Math.abs(gp.axes[2]) > 0.15 ? gp.axes[2] : 0;
    const ry = Math.abs(gp.axes[3]) > 0.15 ? gp.axes[3] : 0;
    // D-pad: buttons[12]=up, buttons[13]=down, buttons[14]=left, buttons[15]=right
    gamepadDpadUp = gp.buttons[12]?.pressed || false;
    gamepadDpadDown = gp.buttons[13]?.pressed || false;
    gamepadDpadLeft = gp.buttons[14]?.pressed || false;
    gamepadDpadRight = gp.buttons[15]?.pressed || false;
    // Hide cursor when gamepad has any input
    if (lx || ly || rx || ry || gp.buttons.some(b => b?.pressed)) {
      setInputMode('gamepad');
      hideCursor();
    }
    gamepadMoveY = ly;
    gamepadMoveX = lx;
    gamepadLookX = rx;
    gamepadLookY = ry;
    const snowPressed = !!gp.buttons[7]?.pressed;
    if (minigames?.ghostGame) {
      if (lastInputMode === 'gamepad') minigames.setVacuum(snowPressed, 'gamepad');
    } else if (snowPressed && !gamepadState.snowWasPressed) winter.action();
    gamepadState.snowWasPressed = snowPressed;
    if (gp.buttons[4]?.pressed && !gamepadState.skatesWasPressed) winter.toggleSkates();
    gamepadState.skatesWasPressed = !!gp.buttons[4]?.pressed;
    if (gp.buttons[5]?.pressed && !gamepadState.decorationWasPressed) minigames?.cycleDecoration();
    gamepadState.decorationWasPressed = !!gp.buttons[5]?.pressed;
    // A=buttons[0], B=buttons[1], X=buttons[2], Y=buttons[3]
    if (gp.buttons[0]?.pressed && !gamepadState.aWasPressed) { gamepadA = true; gamepadState.aWasPressed = true; }
    else if (!gp.buttons[0]?.pressed) gamepadState.aWasPressed = false;
    if (gp.buttons[1]?.pressed && !gamepadState.bWasPressed) { gamepadB = true; gamepadState.bWasPressed = true; }
    else if (!gp.buttons[1]?.pressed) gamepadState.bWasPressed = false;
    if (gp.buttons[2]?.pressed && !gamepadState.xWasPressed) { gamepadX = true; gamepadState.xWasPressed = true; }
    else if (!gp.buttons[2]?.pressed) gamepadState.xWasPressed = false;
    if (gp.buttons[9]?.pressed && !gamepadState.menuWasPressed) { gamepadMenu = true; gamepadState.menuWasPressed = true; }
    else if (!gp.buttons[9]?.pressed) gamepadState.menuWasPressed = false;
    if (gp.buttons[3]?.pressed && !gamepadState.yWasPressed) { gamepadY = true; gamepadState.yWasPressed = true; }
    else if (!gp.buttons[3]?.pressed) gamepadState.yWasPressed = false;
    break; // Use first connected gamepad
  }
  
  // If minigames modal is open, handle navigation there instead
  if (minigamesOpen) {
    if (gamepadB) closeMinigames();
    if (gamepadA) { selectMinigame(); gamepadA = false; }
    if (gamepadDpadUp && !gamepadState.dpadUpWasPressed) { minigamesSelectedIndex = Math.max(0, minigamesSelectedIndex - 1); updateMinigamesSelection(); }
    if (gamepadDpadDown && !gamepadState.dpadDownWasPressed) { minigamesSelectedIndex = Math.min(minigameItems().length - 1, minigamesSelectedIndex + 1); updateMinigamesSelection(); }
    gamepadState.dpadUpWasPressed = gamepadDpadUp;
    gamepadState.dpadDownWasPressed = gamepadDpadDown;
  } else {
    // D-pad left/right for camera rotation (only when modal closed)
    if (gamepadDpadLeft) cameraAngle += delta * 2.5;
    if (gamepadDpadRight) cameraAngle -= delta * 2.5;
  }
  
  // Menu opens minigames; X is dedicated to setting up / taking down camp.
  if (gamepadMenu) {
    if (minigamesOpen) closeMinigames();
    else openMinigames();
  }
  if (gamepadX && !minigamesOpen && !isSleeping) pitchCamp();
  
  // D-pad up/down = zoom in/out (hold), or double-tap for preset views (only when modal closed)
  if (!minigamesOpen) {
    const now = performance.now();
    if (!isFirstPerson() && gamepadDpadUp && !gamepadState.dpadUpWasPressed) {
      // Check for double-tap (within 300ms)
      if (now - gamepadState.dpadUpLastTap < 300) {
        // Double-tap up: reset to default view
        cameraDistance = 6;
        cameraHeight = 6;
      }
      gamepadState.dpadUpLastTap = now;
    }
    gamepadState.dpadUpWasPressed = gamepadDpadUp;
    if (!isFirstPerson() && gamepadDpadDown && !gamepadState.dpadDownWasPressed) {
      // Check for double-tap (within 300ms)
      if (now - gamepadState.dpadDownLastTap < 300) {
        // Double-tap down: zoom out to overhead angled view
        cameraDistance = 30;
        cameraHeight = 9;  // ~75% tilt for angled overhead
      }
      gamepadState.dpadDownLastTap = now;
    }
    gamepadState.dpadDownWasPressed = gamepadDpadDown;
    // Hold for continuous zoom
    if (!isFirstPerson() && gamepadDpadUp) cameraDistance = Math.max(4, cameraDistance - delta * 15);
    if (!isFirstPerson() && gamepadDpadDown) cameraDistance = Math.min(60, cameraDistance + delta * 15);
    // Right stick Y = tilt camera
    if (gamepadLookY) {
      adjustCameraLook(-gamepadLookY * delta * 1.3);
    }
  }
  
  if (gamepadA && !minigamesOpen) interactWithCamp(false);
  if (gamepadB && !isSleeping && !minigamesOpen) {
    if (flashlightOn || flashlightBattery > 0) {  // Can only turn on if battery > 0
      flashlightOn = !flashlightOn;
      document.getElementById('btn-flashlight').style.borderColor = 'rgba(255,255,255,0.3)';
    }
  }
  // Tent entry and waking are exclusively A interactions.
  if (gamepadY && !minigamesOpen) {
    if (!minigames?.toggleDelete() && !isSleeping && (sittingFireId !== null || walkingToFire)) standUp();
  }

  let moveInput = 0;
  let strafeInput = 0;  // Gamepad strafe (left stick X in pan mode)
  if (keys['w'] || keys['arrowup']) moveInput = -1;
  if (keys['s'] || keys['arrowdown']) moveInput = 1;
  if (gamepadMoveY) moveInput = gamepadMoveY;
  // All seasons share camera-relative movement and strafing.
  if (keys['a']) strafeInput = -1;
  if (keys['d']) strafeInput = 1;
  if (gamepadMoveX) strafeInput = gamepadMoveX;
  if (keys['arrowleft']) strafeInput = -1;
  if (keys['arrowright']) strafeInput = 1;
  if (gamepadLookX && !minigamesOpen) {
    const turn = gamepadLookX * 2.5 * delta * (invertX ? 1 : -1);
    cameraAngle += turn;
  }
  if (leverActive) {
    moveInput = leverY;
    strafeInput = leverX;  // Virtual joystick X always strafes
    walkingToTent = false;
  }

  if ((isSleeping || sittingFireId !== null) && !minigamesOpen) {
    // Resting movement controls orbit the campsite instead of moving the camper.
    // S/D are supported alongside A/D and the arrow keys.
    const orbitX = (keys['d'] || keys['arrowright'] ? 1 : 0) -
      (keys['a'] || keys['s'] || keys['arrowleft'] ? 1 : 0);
    const orbitY = (keys['w'] || keys['arrowup'] ? 1 : 0) - (keys['arrowdown'] ? 1 : 0);
    cameraAngle += THREE.MathUtils.clamp(orbitX + gamepadMoveX, -1, 1) * delta * 2.5 * (invertX ? -1 : 1);
    adjustCameraLook(THREE.MathUtils.clamp(orbitY - gamepadMoveY, -1, 1) * delta * 1.3);
    cameraTargetAngle = cameraAngle;
  }

  const manualMovement = Math.abs(moveInput) > 0.1 || Math.abs(strafeInput) > 0.1 ||
    (controlMode === 'joystick' && (Math.abs(gamepadMoveX) > 0.1 || Math.abs(leverX) > 0.1 ||
      keys['arrowleft'] || keys['arrowright']));
  if (manualMovement && walkingToFire) standUp();
  if (sittingFireId !== null && !fireDirection(sittingFireId)) standUp();

  if (walkingToFire && !isSleeping) {
    const target = walkingToFire;
    if (!fireDirection(target.id)) {
      standUp();
    } else {
      moveInput = strafeInput = 0;
      const up = new THREE.Vector3(0, 1, 0);
      const towardSeat = target.direction.clone().applyQuaternion(globeRotation);
      const angle = up.angleTo(towardSeat);
      const correction = new THREE.Quaternion().setFromUnitVectors(towardSeat, up);
      const candidate = globeRotation.clone().premultiply(new THREE.Quaternion().slerp(correction,
        angle < 1e-6 ? 1 : Math.min(1, 0.2 * delta / angle))).normalize();
      minigames?.slowMovement(candidate);
      const blockedByProp = minigames?.blocksMovement(candidate);
      if (blockedByProp) standUp();
      else globeRotation.copy(candidate);
      if (!blockedByProp && angle <= 0.2 * delta) {
        sittingFireId = target.id;
        walkingToFire = null;
        clearMovementInput();
        document.getElementById('btn-stand').style.display = 'block';
        showToast('Sitting by the fire. Orbit to look around; click the fire or choose Stand up to get up.');
      }
    }
  }

  // Auto-walk to tent
  if (walkingToTent && !isSleeping) {
    const tentDirection = ownTentDirection();
    if (!tentDirection) {
      walkingToTent = false;
    } else {
      moveInput = strafeInput = 0;
      const up = new THREE.Vector3(0, 1, 0);
      const towardTent = tentDirection.applyQuaternion(globeRotation);
      const angle = up.angleTo(towardTent);
      if (angle * GLOBE_RADIUS < 0.4) {
        enterTent();
      } else {
        // Shortest physical route, preserving the current orientation around the globe.
        const walkSpeed = (player.userData.swimming ? SWIM_SPEED : 0.2) * delta;
        const correction = new THREE.Quaternion().setFromUnitVectors(towardTent, up);
        const step = new THREE.Quaternion().slerp(correction, Math.min(1, walkSpeed / angle));
        const candidate = globeRotation.clone().premultiply(step).normalize();
        minigames?.slowMovement(candidate);
        if (minigames?.blocksMovement(candidate)) walkingToTent = false;
        else globeRotation.copy(candidate);
      }
    }
  }

  const movementLocked = isSleeping || sittingFireId !== null || minigamesOpen || !!minigames?.locked();
  if (movementLocked) { moveInput = strafeInput = 0; playerBounceState = null; }

  // The camper faces the camera's forward direction in every season.
  if (movementLocked) {
    if (sittingFireId !== null) {
      const towardFire = fireDirection(sittingFireId)?.applyQuaternion(globeRotation);
      if (towardFire) playerFacing = Math.atan2(towardFire.x, towardFire.z);
    }
  } else {
    playerFacing = cameraAngle + Math.PI;
  }

  if (walkingToFire) {
    const towardSeat = walkingToFire.direction.clone().applyQuaternion(globeRotation);
    playerFacing = Math.atan2(towardSeat.x, towardSeat.z);
  }
  const isWalking = !movementLocked && (Math.abs(moveInput) > 0.1 || Math.abs(strafeInput) > 0.1 || walkingToTent || !!walkingToFire);
  const moveSpeed = (player.userData.swimming ? SWIM_SPEED : 0.2) * delta;

  const moveFacing = playerFacing;
  const sledMotion = minigames?.sledMovement(moveInput, strafeInput, moveFacing, delta, movementLocked || !!playerBounceState);
  const iceMotion = sledMotion || winter.movement(moveInput, strafeInput, moveFacing, delta,
    movementLocked || !!playerBounceState || walkingToTent || !!walkingToFire || minigamesOpen);
  if (!movementLocked && !playerBounceState && (Math.abs(moveInput) > 0.1 || Math.abs(strafeInput) > 0.1 || iceMotion.lengthSq() > 0.000001)) {
    // Forward/back movement
    const step = moveSpeed * moveInput;
    // Strafe movement (perpendicular to facing, i.e. facing + 90 degrees)
    const strafeStep = moveSpeed * strafeInput;
    const strafeAngle = moveFacing + Math.PI / 2;
    // Combine both movements
    const totalX = winter.enabled || sledMotion ? iceMotion.x * delta : step * Math.cos(moveFacing) + strafeStep * Math.cos(strafeAngle);
    const totalZ = winter.enabled || sledMotion ? iceMotion.y * delta : step * Math.sin(moveFacing) + strafeStep * Math.sin(strafeAngle);
    const rotX = new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(1, 0, 0), totalX);
    const rotZ = new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(0, 0, 1), -totalZ);
    const newRotation = globeRotation.clone().premultiply(rotX).premultiply(rotZ);
    minigames?.slowMovement(newRotation);

    const playerWorldPos = new THREE.Vector3(0, GLOBE_RADIUS, 0);
    let canMove = minigames?.allowMove(newRotation) !== false && !minigames?.blocksMovement(newRotation);
    // Skip own tent collision only when actively walking into it
    const activeColliders = [...collidables, ...tentColliders.filter(c => !c.isOwn || !walkingToTent)];
    for (const c of activeColliders) {
      const newObjPos = latLonToWorld(c.lat, c.lon).applyQuaternion(newRotation);
      const newDist = playerWorldPos.distanceTo(newObjPos);
      const minDist = c.radius + 0.5;
      if (newDist < minDist) {
        const curObjPos = latLonToWorld(c.lat, c.lon).applyQuaternion(globeRotation);
        const curDist = playerWorldPos.distanceTo(curObjPos);
        if (newDist < curDist) {
          canMove = false;
          break;
        }
      }
    }
    // Test surface positions, independent of the visual hop and terrain height.
    let playerCollisionId = null;
    let collisionBounceDir = null;
    if (canMove && !minigames?.spectator) {
      const localPlayerPos = new THREE.Vector3(0, GLOBE_RADIUS, 0);
      for (const id in otherPlayers) {
        const p = otherPlayers[id];
        if (!p.mesh.visible) continue;
        // Compute where other player would appear if we moved to newRotation
        const otherGlobeDir = new THREE.Vector3(0, 1, 0).applyQuaternion(p.currentGlobeRotation.clone().invert());
        const otherNewWorldPos = otherGlobeDir.clone().applyQuaternion(newRotation).multiplyScalar(GLOBE_RADIUS);
        // Sanity check: skip if position is NaN
        if (!Number.isFinite(otherNewWorldPos.x)) {
          mpLog('WARN: NaN position for ' + id.substring(0,6));
          continue;
        }
        const dist = localPlayerPos.distanceTo(otherNewWorldPos);
        const otherCurrentPos = otherGlobeDir.clone().applyQuaternion(globeRotation).multiplyScalar(GLOBE_RADIUS);
        if (dist < 0.55 && dist < localPlayerPos.distanceTo(otherCurrentPos)) {
          canMove = false;
          playerCollisionId = id;
          // Retreat along the contact normal at the current position, without sliding first.
          collisionBounceDir = new THREE.Vector3(otherCurrentPos.z, 0, -otherCurrentPos.x);
          if (collisionBounceDir.lengthSq() < 1e-8) collisionBounceDir.set(-totalX, 0, totalZ);
          collisionBounceDir.normalize().applyQuaternion(globeRotation.clone().invert());
          break;
        }
      }
    }
    if (canMove) {
      globeRotation.copy(newRotation);
    } else if (playerCollisionId) {
      startPlayerBump(playerCollisionId, collisionBounceDir, true);
    } else {
      // Smooth slide: try progressively larger angle offsets to find a clear path
      winter.stop();
      let slid = false;
      for (const angleOffset of [0.4, -0.4, 0.8, -0.8, 1.2, -1.2, Math.PI/2, -Math.PI/2]) {
        const slideAngle = moveFacing + angleOffset;
        const sRotX = new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(1, 0, 0), step * 0.8 * Math.cos(slideAngle));
        const sRotZ = new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(0, 0, 1), -step * 0.8 * Math.sin(slideAngle));
        const slideRotation = globeRotation.clone().premultiply(sRotX).premultiply(sRotZ);
        minigames?.slowMovement(slideRotation);
        let slideOk = minigames?.allowMove(slideRotation) !== false && !minigames?.blocksMovement(slideRotation);
        for (const c of activeColliders) {
          const sObjPos = latLonToWorld(c.lat, c.lon).applyQuaternion(slideRotation);
          const sDist = playerWorldPos.distanceTo(sObjPos);
          const curObjPos = latLonToWorld(c.lat, c.lon).applyQuaternion(globeRotation);
          const curDist = playerWorldPos.distanceTo(curObjPos);
          if (sDist < c.radius + 0.5 && sDist < curDist) { slideOk = false; break; }
        }
        // Also check player collision for slides
        if (slideOk) {
          for (const p of Object.values(otherPlayers)) {
            if (!p.mesh.visible) continue;
            const otherGlobeDir = new THREE.Vector3(0, 1, 0).applyQuaternion(p.currentGlobeRotation.clone().invert());
            const otherSlideWorldPos = otherGlobeDir.clone().applyQuaternion(slideRotation).multiplyScalar(GLOBE_RADIUS);
            const slideDist = playerWorldPos.distanceTo(otherSlideWorldPos);
            const curOtherWorldPos = otherGlobeDir.clone().applyQuaternion(globeRotation).multiplyScalar(GLOBE_RADIUS);
            const curPlayerDist = playerWorldPos.distanceTo(curOtherWorldPos);
            if (slideDist < 0.55 && slideDist < curPlayerDist) { slideOk = false; break; }
          }
        }
        if (slideOk) {
          globeRotation.copy(slideRotation);
          slid = true;
          break;
        }
      }
    }
  }

  if (playerBounceState && !movementLocked) {
    const b = playerBounceState;
    const next = Math.min(BUMP_DURATION, b.elapsed + delta);
    const distance = BUMP_DISTANCE * (bumpTravel(next) - bumpTravel(b.elapsed));
    const candidate = globeRotation.clone().multiply(
      new THREE.Quaternion().setFromAxisAngle(b.axis, distance / GLOBE_RADIUS));
    minigames?.slowMovement(candidate);
    const origin = new THREE.Vector3(0, GLOBE_RADIUS, 0);
    const blocked = [...collidables, ...tentColliders].some(c => {
      const pos = latLonToWorld(c.lat, c.lon);
      const before = origin.distanceTo(pos.clone().applyQuaternion(globeRotation));
      const after = origin.distanceTo(pos.applyQuaternion(candidate));
      return after < c.radius + 0.5 && after < before;
    }) || Object.values(otherPlayers).some(p => {
      if (!p.mesh.visible) return false;
      const pos = new THREE.Vector3(0, GLOBE_RADIUS, 0).applyQuaternion(p.currentGlobeRotation.clone().invert());
      const before = origin.distanceTo(pos.clone().applyQuaternion(globeRotation));
      const after = origin.distanceTo(pos.applyQuaternion(candidate));
      return after < 0.55 && after < before;
    });
    if (!blocked && !minigames?.blocksMovement(candidate)) globeRotation.copy(candidate).normalize();
    b.elapsed = next;
    if (next >= BUMP_DURATION) playerBounceState = null;
  }
  globePivot.quaternion.copy(globeRotation);
  player.rotation.set(0, playerFacing, 0);
  player.scale.setScalar(1);

  // Resolve terrain and buoyancy before the camera and animation use our height.
  globePivot.updateMatrixWorld(true);
  raycaster.set(new THREE.Vector3(0, GLOBE_RADIUS + 5, 0), new THREE.Vector3(0, -1, 0));
  const hits = raycaster.intersectObject(globe, false);
  const terrainY = hits.length ? hits[0].point.y : (player.userData.terrainY ?? GLOBE_RADIUS);
  player.userData.terrainY = terrainY;
  player.position.y = updateSwimming(player, terrainY, isWalking && !isSleeping, delta, winter);
  player.userData.groundY = player.position.y;
  player.position.y = minigames?.sledHeight(player.position.y, delta) ?? player.position.y;
  if (minigames?.sledLift > 0.05) player.userData.onIce = false;
  resetSwimLimbs(player);

  // Camera: cameraHeight is tilt (1=ground level, 12=overhead), cameraDistance is total distance
  const tiltFraction = cameraHeight / 12;
  const viewDistance = cameraDistance + 1;
  const tentFocus = isSleeping ? campModels.get(localPlayerId)?.tent.getWorldPosition(new THREE.Vector3()) : null;
  const focusX = tentFocus?.x ?? 0;
  const focusZ = tentFocus?.z ?? 0;
  const playerY = tentFocus?.y ?? (minigames?.ridesSled() ? player.position.y : player.userData.groundY ?? player.position.y);
  cameraGroundY = cameraGroundY === null ? playerY
    : THREE.MathUtils.lerp(cameraGroundY, playerY, 1 - Math.exp(-10 * delta));
  const camY = cameraGroundY + tiltFraction * viewDistance;
  const camHorizDist = viewDistance * (1 - tiltFraction * 0.85);
  const shoulderOffset = 0;
  const camX = Math.sin(cameraAngle) * camHorizDist + Math.cos(cameraAngle) * shoulderOffset;
  const camZ = Math.cos(cameraAngle) * camHorizDist - Math.sin(cameraAngle) * shoulderOffset;
  camera.position.set(focusX + camX, camY, focusZ + camZ);
  // Frame above the camper's head and slightly farther back. Looking up/down
  // directly rotates the camera; there is no independent snowball aim angle.
  camera.lookAt(focusX, cameraGroundY + 2.1, focusZ);
  if (!movementLocked) camera.rotateX(cameraLookPitch);
  const firstPerson = isFirstPerson();
  if (firstPersonProjection !== firstPerson) {
    firstPersonProjection = firstPerson;
    camera.fov = firstPerson ? 75 : 50;
    camera.near = firstPerson ? 0.04 : 0.1;
    camera.updateProjectionMatrix();
  }
  if (firstPerson) {
    const forward = new THREE.Vector3(-Math.sin(cameraAngle), 0, -Math.cos(cameraAngle));
    camera.position.copy(player.position).add(new THREE.Vector3(0, sittingFireId !== null ? 0.77 : 1.05, 0)).addScaledVector(forward, 0.08);
    camera.lookAt(camera.position.clone().add(forward));
    camera.rotateX(firstPersonPitch);
  }
  camera.updateMatrixWorld(true);
  atmosMat.uniforms.viewVector.value.copy(camera.position);

  const isKeyTurning = keys['arrowleft'] || keys['arrowright'];  // A/D now strafe, arrows turn
  const isCameraPanTurning = (isDragging || orbitTouchId !== null) && controlMode === 'pan';
  const isTurning = !movementLocked && (isCameraPanTurning || isKeyTurning);

  if (isWalking || isTurning) {
    walkCycle += delta * (isWalking ? 8 : 12);
    const swing = Math.sin(walkCycle) * (isWalking ? 0.5 : 0.35);
    player.userData.leftLeg.rotation.x = swing;
    player.userData.rightLeg.rotation.x = -swing;
    player.userData.leftArm.rotation.x = -swing * 0.4;
    player.userData.rightArm.rotation.x = swing * 0.4;
    player.rotation.z = Math.sin(walkCycle) * (isWalking ? 0.04 : 0.03);
  } else {
    walkCycle = 0;
    player.userData.leftLeg.rotation.x *= 0.85;
    player.userData.rightLeg.rotation.x *= 0.85;
    player.userData.leftArm.rotation.x *= 0.85;
    player.userData.rightArm.rotation.x *= 0.85;
    player.rotation.z *= 0.9;
  }

  // Broadcast position to peers (10 times/sec)
  if (clock.elapsedTime - (animate._lastBroadcast || 0) > 0.1) {
    animate._lastBroadcast = clock.elapsedTime;
    broadcastPosition(globeRotation, playerFacing, {
      phase: walkCycle % (Math.PI * 2),
      rate: isWalking ? 8 : isTurning ? 12 : 0,
      amplitude: isWalking ? 0.5 : 0.35,
      waddle: isWalking ? 0.04 : 0.03,
      swing: Math.max(-0.5, Math.min(0.5, player.userData.leftLeg.rotation.x)),
      roll: Math.max(-0.1, Math.min(0.1, player.rotation.z)),
      flashlight: flashlightOn && !isSleeping,
      moving: isWalking && !isSleeping,
      sitting: sittingFireId !== null,
      snowball: winter.enabled && winter.holding,
      pinecone: !winter.enabled && winter.holding,
      flamingPinecone: winter.flamingPinecone,
      skating: winter.skating,
      sledding: !!minigames?.ridesSled(),
      sledLift: minigames?.sledLift || 0,
      sledPitch: minigames?.sledPitch || 0,
      ghostVacuum: !!minigames?.ghostVacuum,
      ghostAim: minigames?.ghostGame ? minigames.ghostAim() : undefined,
      iceVelocity: winter.sharedVelocity(),
    });
  }
  
  // Save session state every 5 seconds
  if (clock.elapsedTime - (animate._lastSessionSave || 0) > 5) {
    animate._lastSessionSave = clock.elapsedTime;
    saveSession();
  }

  // Animate connected players.
  animateOtherPlayers(delta);

  if (sittingFireId !== null) applySitPose(player);
  else applySwimPose(player);
  applyBumpPose(player, playerBounceState, globeRotation);

  // Shared room clock continues through dropped frames and background tabs.
  {
    timeOfDay = minigames?.night ? 0 : sharedHour();
    document.getElementById('time-slider').value = timeOfDay;
    const h = Math.floor(timeOfDay);
    const m = Math.floor((timeOfDay - h) * 60);
    document.getElementById('time-display').textContent = `${h.toString().padStart(2, '0')}:${m.toString().padStart(2, '0')}`;
  }
  winter.update(delta);
  atmosMat.uniforms.viewVector.value.copy(camera.position);
  updateDayNight(delta);

  // Animate fireflies
  if (fireflyMat.opacity > 0) {
    fireflies.quaternion.copy(globeRotation);
    const fp = fireflyGeo.attributes.position.array;
    for (let i = 0; i < fireflyCount; i++) {
      const d = fireflyData[i];
      fp[i * 3] += Math.sin(clock.elapsedTime * d.speed + d.phase) * d.drift * delta;
      fp[i * 3 + 1] += Math.sin(clock.elapsedTime * d.speed * 0.7 + d.phase * 2) * 0.2 * delta;
      fp[i * 3 + 2] += Math.cos(clock.elapsedTime * d.speed * 0.5 + d.phase) * d.drift * delta;
    }
    fireflyGeo.attributes.position.needsUpdate = true;
  }

  for (const model of campModels.values()) {
    if (!model.sleeping) {
      for (const z of model.zSprites) disposeCampObject(z.sprite);
      model.zSprites = [];
      model.zTimer = 4.5;
      continue;
    }
    model.zTimer += delta;
    if (model.zTimer >= 5) {
      model.zTimer = 0;
      for (let i = 0; i < 3; i++) {
        const size = 2 - i;  // size: 2, 1, 0 (biggest first)
        const sprite = makeZSprite(size, 0);
        sprite.position.copy(model.tent.position).add(new THREE.Vector3(0, 1.2, 0));
        model.group.add(sprite);
        // Biggest (size=2) appears first (age=0), rises fastest (speed=0.5)
        // Smallest (size=0) appears last (age=-1.2), rises slowest (speed=0.3)
        model.zSprites.push({ sprite, age: -i * 0.6, speed: 0.5 - i * 0.1 });
      }
    }
    for (let i = model.zSprites.length - 1; i >= 0; i--) {
      const z = model.zSprites[i];
      z.age += delta;
      z.sprite.visible = z.age >= 0;
      if (z.age >= 0) {
        z.sprite.position.y += z.speed * delta;
        z.sprite.position.x += (z.sprite.userData.xDrift || 0.05) * delta;
        z.sprite.material.opacity = Math.max(0, 1 - z.age / 3.5);
      }
      if (z.age > 3.5) { disposeCampObject(z.sprite); model.zSprites.splice(i, 1); }
    }
  }

  // Animate fire if camp is pitched
  for (const model of campModels.values()) {
    if (!model.fireAnchor.visible) continue;
    const { campFireGeo, campFireAlphas, campFireLifespan, campCoals, campFireLight,
      campFireLight2, campSmokeGeo, campSmokeVelocities } = model;
    const elapsed = clock.elapsedTime;

    // Fire light flicker
    campFireLight.intensity += (Math.random() - 0.5) * 0.4;
    campFireLight.intensity = Math.max(0.5, Math.min(4, campFireLight.intensity));
    campFireLight2.intensity = campFireLight.intensity * 0.6 + (Math.random() - 0.5) * 0.2;

    // Coal pulsing
    for (let i = 0; i < campCoals.length; i++) {
      const pulse = 0.3 + Math.sin(elapsed * (1.5 + i * 0.3) + i * 2) * 0.25 + Math.random() * 0.1;
      campCoals[i].material.emissiveIntensity = pulse;
    }

    // Fire particle physics
    const fp = campFireGeo.attributes.position.array;
    for (let i = 0; i < 56; i++) {
      advanceFireParticle(fp, i, campFireAlphas[i] === 1);

      if (fp[i * 3 + 1] > campFireLifespan[i]) {
        respawnCampFireParticle(fp, i, false, campFireLifespan, campFireAlphas);
      }
    }
    campFireGeo.attributes.position.needsUpdate = true;

    // Smoke animation
    const sp = campSmokeGeo.attributes.position.array;
    for (let i = 0; i < 30; i++) {
      advanceSmokeParticle(sp, i, campSmokeVelocities[i]);
      if (sp[i * 3 + 1] > 5) {
        sp[i * 3] = (Math.random() - 0.5) * 0.3;
        sp[i * 3 + 1] = 1.5;
        sp[i * 3 + 2] = (Math.random() - 0.5) * 0.3;
      }
    }
    campSmokeGeo.attributes.position.needsUpdate = true;
  }

  // Tent compass indicator and distance-based pack-up control
  const tentCompass = document.getElementById('tent-compass');
  const tentCompassLine = document.getElementById('tent-compass-line');
  const btnPitch = document.getElementById('btn-pitch');
  if (campPitched && localCampState && !isSleeping) {
    const nearTent = ownTentDistance() <= TENT_INTERACTION_DISTANCE;
    
    // Disable pack-up if too far from tent
    btnPitch.style.opacity = nearTent ? '1' : '0.4';
    btnPitch.style.pointerEvents = nearTent ? 'auto' : 'none';
    
    // Show compass if not near tent
    if (!nearTent) {
      const tentDir = ownTentDirection();
      if (tentDir) {
        tentCompass.style.display = 'block';
        // Camera-relative bearing to the same physical tent used by interaction checks.
        tentDir.applyQuaternion(globeRotation);
        const right = new THREE.Vector3(Math.cos(cameraAngle), 0, -Math.sin(cameraAngle));
        const forward = new THREE.Vector3(-Math.sin(cameraAngle), 0, -Math.cos(cameraAngle));
        const angle = Math.atan2(tentDir.dot(right), tentDir.dot(forward));
        // Keep only the outer half: a short tick across the button's rim.
        tentCompassLine.setAttribute('x1', 32 + Math.sin(angle) * 14);
        tentCompassLine.setAttribute('y1', 32 - Math.cos(angle) * 14);
        const x2 = 32 + Math.sin(angle) * 28;
        const y2 = 32 - Math.cos(angle) * 28;
        tentCompassLine.setAttribute('x2', x2);
        tentCompassLine.setAttribute('y2', y2);
      } else {
        tentCompass.style.display = 'none';
      }
    } else {
      tentCompass.style.display = 'none';
    }
  } else {
    tentCompass.style.display = 'none';
    btnPitch.style.opacity = '1';
    btnPitch.style.pointerEvents = 'auto';
  }

  if (player.userData.swimming) {
    btnPitch.style.opacity = '0.4';
    btnPitch.style.pointerEvents = 'none';
  }
  btnPitch.setAttribute('aria-disabled', String(!!player.userData.swimming || (campPitched && ownTentDistance() > TENT_INTERACTION_DISTANCE)));
  updateCampInteraction();
  minigames?.update(delta);
  if (minigames?.blind) {
    // Reuse the renderer's clear frame while the seeker counts; no new overlay.
    renderer.setClearColor(0x101018); renderer.clear();
  } else renderer.render(scene, camera);
  if (onReady) {
    const ready = onReady;
    onReady = null;
    ready();
  }
}
window.syncCamps = syncCamps;
syncCamps();

minigames = createMinigames({
  disableDecorationGlow: isIOSDevice(navigator), getDaylight: () => sun.intensity / 1.2,
  getViewportHeight: () => renderer.domElement.height,
  mobile: mobileGraphics, getSnowfall: () => sharedEnvironment?.snowfall || 0,
  scene, camera, globePivot, globe, player, localLabel: localNameLabel, winter, waterRadius: WATER_RADIUS,
  get localId() { return localPlayerId; }, getPeers: () => otherPlayers,
  getRotation: () => globeRotation, getFacing: () => playerFacing,
  isFirstPerson,
  setFacing: facing => { playerFacing = facing; cameraAngle = facing - Math.PI; cameraTargetAngle = cameraAngle; },
  getTeam: () => localTeam, now: roomNow, latLonToWorld,
  getColliders: () => [...collidables, ...tentColliders],
  getAttachmentMeshes: () => [...trees.map(t => t.obj.children[0]), ...rockData.map(r => r.obj),
    ...Array.from(campModels.values(), m => m.tent).filter(t => t.visible)],
  getWebSupportMeshes: () => [globe, ...trees.map(t => t.obj), ...rockData.map(r => r.obj),
    ...Array.from(campModels.values(), m => m.tent).filter(t => t.visible)],
  getNaturalWebSupportMeshes: () => [globe, ...trees.map(t => t.obj), ...rockData.map(r => r.obj)],
  getObstacles: () => [...trees.map(t => t.obj), ...rockData.map(r => r.obj),
    ...Array.from(campModels.values(), m => m.tent).filter(t => t.visible)],
  canEditWorld: () => worldSettingsOwner,
  canInteract: () => !isSleeping && sittingFireId === null && !walkingToTent && !walkingToFire,
  restoreVisibility: () => { player.visible = !isSleeping; },
  online: () => multiplayerReady && minigameProtocol === 1 && signalingWs?.readyState === WebSocket.OPEN,
  send: message => {
    if (!multiplayerReady || minigameProtocol !== 1 || signalingWs?.readyState !== WebSocket.OPEN || signalingWs.bufferedAmount > 65536) return false;
    signalingWs.send(JSON.stringify(message)); return true;
  },
  toast: showToast, menuOpen: () => minigamesOpen, closeMenu: closeMinigames,
  getSelectedKey: () => minigameItems()[minigamesSelectedIndex]?.dataset.key,
  restoreSelection: key => {
    const index = [...minigameItems()].findIndex(item => item.dataset.key === key);
    if (index >= 0) minigamesSelectedIndex = index;
    minigamesSelectedIndex = Math.min(minigamesSelectedIndex, minigameItems().length - 1);
    if (minigamesOpen) updateMinigamesSelection();
  },
  refreshScores: updateTeamLeaderboard, refreshTeams: updatePlayerHatColors,
  flashlightOn: () => flashlightOn && flashlightBattery > 0 && !isSleeping && player.visible,
  readyFlashlight: () => { flashlightBattery = 1; flashlightOn = true; },
  preparePlayer: () => {
    if (isSleeping) wakeUp();
    standUp(); walkingToTent = false; walkingToFire = null;
    playerBounceState = null; clearMovementInput(); winter.stop(); player.visible = true;
  },
});
window.receiveMinigameEvent = minigames.receive;
window.syncMinigames = minigames.sync;
window.resetMinigames = minigames.reset;
if (sharedMinigame) minigames.receive({ type: 'minigame-state', state: sharedMinigame });
minigames.sync();

animate();

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});
if (!matchMedia('(pointer: coarse)').matches) document.getElementById('lever-wrapper').style.display = 'none';

// Broadcast hello to all connected peers once game starts
setTimeout(() => broadcastHello(globeRotation), 1000);

// Show room code in settings
if (roomId) {
  document.getElementById('room-code-value').textContent = formatWorldCode(roomId);
  document.getElementById('room-code-display').style.display = 'block';
  document.getElementById('btn-copy-link-game').addEventListener('click', () => {
    const url = new URL(window.location.href);
    url.search = '';
    url.searchParams.set('world', roomId);
    navigator.clipboard.writeText(url.toString()).then(() => {
      const btn = document.getElementById('btn-copy-link-game');
      btn.textContent = 'Copied!';
      btn.style.borderColor = '#4a4';
      setTimeout(() => { btn.textContent = 'Copy Invite Link'; btn.style.borderColor = '#555'; }, 2000);
    });
  });
}

// Show control hints based on input mode
updateControlHints();

} // end startGame
</script>
</body>
</html>
