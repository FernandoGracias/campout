<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Campout</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { overflow: hidden; background: #1a1a2e; font-family: system-ui, sans-serif; touch-action: none; -webkit-user-select: none; user-select: none; }
canvas { display: block; }

#joystick-zone {
  position: fixed;
  bottom: 30px;
  left: 30px;
  width: 130px;
  height: 130px;
  z-index: 100;
}
#joystick-base {
  position: absolute;
  width: 110px;
  height: 110px;
  left: 10px;
  top: 10px;
  border-radius: 50%;
  background: rgba(255,255,255,0.08);
  border: 2px solid rgba(255,255,255,0.2);
}
#joystick-knob {
  position: absolute;
  width: 44px;
  height: 44px;
  left: 33px;
  top: 33px;
  border-radius: 50%;
  background: rgba(255,255,255,0.25);
  border: 2px solid rgba(255,255,255,0.4);
}

.control-row { margin-bottom: 10px; }

.control-row label { display: block; font-size: 11px; margin-bottom: 4px; color: #aaa; }
.control-row input[type="range"] { width: 100%; }
.control-row button { background: #333; color: #ddd; border: 1px solid #555; padding: 4px 10px; border-radius: 4px; cursor: pointer; font-size: 11px; margin-right: 4px; }
.control-row button:hover { background: #444; }
#controls.open { transform: translateX(0) !important; }
</style>
</head>
<body>

<!-- LANDING SCREEN -->
<div id="landing-screen" style="position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#1a1a2e;z-index:1000;padding:20px;">
  <h1 style="color:#f0c040;font-size:36px;margin-bottom:8px;font-family:system-ui,sans-serif;">Campout</h1>
  <p style="color:#aaa;font-size:14px;margin-bottom:32px;">Multiplayer globe-walking sim</p>
  <div style="display:flex;flex-direction:column;gap:12px;width:100%;max-width:280px;">
    <button id="btn-create-room" style="padding:14px;font-size:16px;background:#337733;color:#fff;border:none;border-radius:8px;cursor:pointer;font-family:system-ui,sans-serif;">Create World</button>
    <div style="display:flex;gap:8px;">
      <input id="input-room-code" type="text" placeholder="World code" maxlength="12" style="flex:1;min-width:0;padding:12px;font-size:16px;background:#2a2a3e;color:#fff;border:1px solid #555;border-radius:8px;text-align:center;font-family:monospace;text-transform:lowercase;">
      <button id="btn-join-room" style="padding:12px 20px;font-size:16px;background:#2266aa;color:#fff;border:none;border-radius:8px;cursor:pointer;font-family:system-ui,sans-serif;">Join</button>
    </div>
  </div>
  <div style="position:absolute;bottom:8px;left:8px;color:rgba(255,255,255,0.3);font-size:10px;font-family:monospace;">v182</div>
</div>

<!-- LOBBY SCREEN -->
<div id="lobby-screen" style="position:fixed;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;background:#1a1a2e;z-index:1000;padding:20px;">
  <h2 style="color:#f0c040;font-size:24px;margin-bottom:4px;font-family:system-ui,sans-serif;">World: <span id="lobby-room-id" style="font-family:monospace;"></span></h2>
  <button id="btn-copy-link" style="background:transparent;border:1px solid #555;color:#aaa;padding:6px 12px;border-radius:6px;cursor:pointer;font-size:12px;margin-bottom:8px;font-family:system-ui,sans-serif;">Copy Invite Link</button>
  <p id="lobby-seed-display" style="color:#666;font-size:11px;margin-bottom:24px;font-family:monospace;"></p>
  <div style="display:flex;flex-direction:column;gap:12px;width:100%;max-width:280px;">
    <div>
      <label style="color:#aaa;font-size:12px;display:block;margin-bottom:4px;">Your Name</label>
      <input id="input-player-name" type="text" placeholder="Camper" maxlength="16" style="width:100%;padding:10px;font-size:16px;background:#2a2a3e;color:#fff;border:1px solid #555;border-radius:8px;font-family:system-ui,sans-serif;">
    </div>
    <div>
      <label style="color:#aaa;font-size:12px;display:block;margin-bottom:4px;">Tent Color</label>
      <div id="lobby-tent-colors" style="display:flex;gap:6px;flex-wrap:wrap;">
        <button data-color="cc5522" style="background:#cc5522;width:32px;height:32px;border:3px solid #fff;border-radius:6px;cursor:pointer;"></button>
        <button data-color="2266aa" style="background:#2266aa;width:32px;height:32px;border:3px solid transparent;border-radius:6px;cursor:pointer;"></button>
        <button data-color="337733" style="background:#337733;width:32px;height:32px;border:3px solid transparent;border-radius:6px;cursor:pointer;"></button>
        <button data-color="aa2222" style="background:#aa2222;width:32px;height:32px;border:3px solid transparent;border-radius:6px;cursor:pointer;"></button>
        <button data-color="ddaa22" style="background:#ddaa22;width:32px;height:32px;border:3px solid transparent;border-radius:6px;cursor:pointer;"></button>
        <button data-color="553388" style="background:#553388;width:32px;height:32px;border:3px solid transparent;border-radius:6px;cursor:pointer;"></button>
        <button data-color="ee66aa" style="background:#ee66aa;width:32px;height:32px;border:3px solid transparent;border-radius:6px;cursor:pointer;"></button>
      </div>
    </div>
    <div>
      <label style="color:#aaa;font-size:12px;display:block;margin-bottom:4px;">Tent Style</label>
      <select id="lobby-tent-style" style="width:100%;padding:10px;font-size:14px;background:#2a2a3e;color:#fff;border:1px solid #555;border-radius:8px;">
        <option value="aframe">A-Frame</option>
        <option value="dome">Dome</option>
        <option value="cabin">Tipi</option>
        <option value="tunnel">Tunnel</option>
      </select>
    </div>
    <div id="lobby-peers" style="color:#aaa;font-size:12px;margin-top:8px;"></div>
    <button id="btn-enter-world" style="margin-top:12px;padding:14px;font-size:16px;background:#f0c040;color:#1a1a2e;border:none;border-radius:8px;cursor:pointer;font-weight:bold;font-family:system-ui,sans-serif;">Enter World</button>
  </div>
</div>

<!-- GAME SCREEN -->
<div id="game-screen" style="display:none;">
<div id="btn-exit-world" style="position:fixed;top:12px;left:12px;width:44px;height:44px;background:rgba(255,255,255,0.06);border:2px solid rgba(255,255,255,0.15);border-radius:8px;display:flex;align-items:center;justify-content:center;cursor:pointer;z-index:200;-webkit-tap-highlight-color:transparent;"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#ddd" stroke-width="2"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg></div>
<div id="controls-row" style="position:fixed;bottom:calc(30px + env(safe-area-inset-bottom, 0px));left:30px;z-index:100;">
  <div style="display:flex;gap:12px;align-items:center;">
    <div style="position:relative;width:48px;height:48px;" id="lever-wrapper">
      <div id="joystick-base" style="display:none;position:absolute;width:72px;height:72px;left:-12px;top:-12px;border-radius:50%;background:rgba(255,255,255,0.06);border:2px solid rgba(255,255,255,0.15);pointer-events:none;"></div>
      <div id="lever-track" style="position:absolute;width:4px;height:80px;left:50%;top:50%;transform:translate(-50%,-50%);border-radius:2px;background:rgba(255,255,255,0.15);pointer-events:none;"></div>
      <div id="lever-zone" style="position:absolute;left:0;top:0;width:48px;height:48px;border-radius:50%;background:rgba(255,255,255,0.06);border:2px solid rgba(255,255,255,0.15);display:flex;align-items:center;justify-content:center;cursor:pointer;-webkit-tap-highlight-color:transparent;"><svg width="22" height="22" viewBox="0 0 512 512" fill="#ddd" stroke="none"><path d="M111.512 21.176c-6.65.088-13.7 1.088-21.162 3.088-87.625 23.48-77.956 222.752-9.297 310.984l.002-.002 99.513-26.664c-3.273-35.578.003-76.04 19.313-113.947 2.605-89.97-24.095-174.31-88.368-173.46zm294.38 0c-64.273-.852-90.972 83.488-88.37 173.46 19.31 37.905 22.587 78.368 19.314 113.946l99.514 26.664.002.002c68.658-88.232 78.327-287.505-9.297-310.984-7.463-2-14.513-3-21.162-3.088zM188.878 350.06l-101.26 27.13c5.495 191.896 200.51 104.13 101.26-27.13zm139.65 0c-99.25 131.26 95.767 219.026 101.262 27.13l-101.263-27.13z"/></svg></div>
    </div>
    <div id="btn-pitch-wrapper" style="position:relative;width:48px;height:48px;">
      <div id="tent-compass" style="position:absolute;inset:-8px;pointer-events:none;display:none;">
        <svg width="64" height="64" viewBox="0 0 64 64" style="position:absolute;left:0;top:0;">
          <line id="tent-compass-line" x1="32" y1="18" x2="32" y2="4" stroke="#f0c040" stroke-width="3" stroke-linecap="round"/>
        </svg>
      </div>
      <div id="btn-pitch" style="position:relative;width:48px;height:48px;border-radius:50%;background:rgba(255,255,255,0.06);border:2px solid rgba(255,255,255,0.15);display:flex;align-items:center;justify-content:center;cursor:pointer;-webkit-tap-highlight-color:transparent;"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#ddd" stroke-width="2"><path d="M12 2L3 20h18L12 2z"/><line x1="12" y1="20" x2="12" y2="14"/></svg><span id="hint-pitch" style="position:absolute;top:-8px;right:-8px;background:#f0c040;color:#1a1a2e;font-size:10px;font-weight:bold;padding:2px 5px;border-radius:4px;font-family:system-ui,sans-serif;display:none;"></span></div>
    </div>
    <div id="btn-flashlight" style="position:relative;width:48px;height:48px;border-radius:50%;background:rgba(255,255,255,0.06);border:2px solid rgba(255,255,255,0.15);display:flex;align-items:center;justify-content:center;cursor:pointer;-webkit-tap-highlight-color:transparent;"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#ddd" stroke-width="2"><rect x="9" y="8" width="6" height="12" rx="1"/><path d="M9 8l-1-4h8l-1 4"/></svg><span id="hint-flashlight" style="position:absolute;top:-8px;right:-8px;background:#f0c040;color:#1a1a2e;font-size:10px;font-weight:bold;padding:2px 5px;border-radius:4px;font-family:system-ui,sans-serif;display:none;"></span></div>
    <div id="btn-minigames" style="position:relative;width:48px;height:48px;border-radius:50%;background:rgba(255,255,255,0.06);border:2px solid rgba(255,255,255,0.15);display:flex;align-items:center;justify-content:center;cursor:pointer;-webkit-tap-highlight-color:transparent;"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#ddd" stroke-width="2"><rect x="2" y="6" width="20" height="12" rx="2"/><circle cx="8" cy="12" r="2"/><circle cx="16" cy="10" r="1"/><circle cx="16" cy="14" r="1"/><circle cx="14" cy="12" r="1"/><circle cx="18" cy="12" r="1"/></svg><span id="hint-minigames" style="position:absolute;top:-8px;right:-8px;background:#f0c040;color:#1a1a2e;font-size:10px;font-weight:bold;padding:2px 5px;border-radius:4px;font-family:system-ui,sans-serif;display:none;"></span></div>
  </div>
</div>

<!-- Toast container -->
<div id="toast-container" style="position:fixed;top:60px;left:50%;transform:translateX(-50%);z-index:1000;display:flex;flex-direction:column;gap:8px;pointer-events:none;"></div>

<!-- Minigames modal -->
<div id="minigames-modal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,0.8);z-index:500;align-items:center;justify-content:center;">
  <div style="background:rgba(30,30,50,0.95);border:2px solid rgba(255,255,255,0.2);border-radius:12px;padding:24px;max-width:400px;width:90%;max-height:80vh;overflow-y:auto;">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;">
      <h2 style="color:#f0c040;font-size:18px;margin:0;font-family:system-ui,sans-serif;">Mini Games</h2>
      <div id="minigames-close" style="width:32px;height:32px;border-radius:50%;background:rgba(255,255,255,0.1);display:flex;align-items:center;justify-content:center;cursor:pointer;"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#ddd" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></div>
    </div>
    <div id="minigames-list" style="display:flex;flex-direction:column;gap:8px;">
      <div class="minigame-item" data-game="coming-soon" style="padding:16px;background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.1);border-radius:8px;cursor:pointer;transition:background 0.2s;">
        <div style="color:#ddd;font-size:14px;font-family:system-ui,sans-serif;">Coming Soon...</div>
        <div style="color:#888;font-size:12px;margin-top:4px;font-family:system-ui,sans-serif;">Mini games will be added here</div>
      </div>
    </div>
  </div>
</div>

<div id="sidebar-toggle" style="position:fixed;top:12px;right:12px;width:44px;height:44px;background:rgba(255,255,255,0.06);border:2px solid rgba(255,255,255,0.15);border-radius:8px;display:flex;align-items:center;justify-content:center;cursor:pointer;z-index:200;-webkit-tap-highlight-color:transparent;"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#ddd" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 01-2.83 2.83l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-4 0v-.09a1.65 1.65 0 00-1-1.51 1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83-2.83l.06-.06a1.65 1.65 0 00.33-1.82 1.65 1.65 0 00-1.51-1H3a2 2 0 010-4h.09a1.65 1.65 0 001.51-1 1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 012.83-2.83l.06.06a1.65 1.65 0 001.82.33H9a1.65 1.65 0 001-1.51V3a2 2 0 014 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 2.83l-.06.06a1.65 1.65 0 00-.33 1.82V9a1.65 1.65 0 001.51 1H21a2 2 0 010 4h-.09a1.65 1.65 0 00-1.51 1z"/></svg></div>

<div id="controls" style="position:fixed;top:0;right:0;bottom:0;width:260px;background:rgba(0,0,0,0.55);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);color:#ddd;padding:60px 16px 16px;z-index:150;overflow-y:auto;transform:translateX(100%);transition:transform 0.3s ease;font-family:monospace;">
  <h3 style="margin-bottom:12px;color:#f0c040;font-size:14px;">CAMP CONTROLS</h3>
  <div class="control-row">
    <label for="winter-enabled"><input type="checkbox" id="winter-enabled"> Winter (room)</label>
    <label for="snow-cover">Ground snow <output id="snow-cover-value">75%</output></label>
    <input type="range" id="snow-cover" min="0" max="100" value="75">
    <label for="snow-fall">Falling snow <output id="snow-fall-value">40%</output></label>
    <input type="range" id="snow-fall" min="0" max="100" value="40">
  </div>
  <div id="room-code-display" style="display:none;margin-bottom:12px;padding:8px;background:rgba(255,255,255,0.08);border-radius:6px;text-align:center;">
    <div style="font-size:10px;color:#888;margin-bottom:2px;">WORLD CODE</div>
    <div id="room-code-value" style="font-size:18px;color:#f0c040;font-family:monospace;letter-spacing:2px;"></div>
    <button id="btn-copy-link-game" style="background:transparent;border:1px solid #555;color:#aaa;padding:4px 10px;border-radius:4px;cursor:pointer;font-size:10px;margin-top:6px;">Copy Invite Link</button>
  </div>
  <div class="control-row">
    <label>Time of Day (room)</label>
    <input type="range" id="time-slider" min="0" max="24" step="0.1" value="12">
    <div id="time-display" style="font-size:11px;color:#f0c040;text-align:center;margin-top:4px;">12:00</div>
    <label style="display:flex;align-items:center;gap:6px;margin-top:6px;font-size:11px;color:#aaa;"><input type="checkbox" id="time-pause"> Pause time cycle</label>
  </div>
  <div class="control-row">
    <label>Moonlight (room)</label>
    <input type="range" id="moonlight-slider" min="0" max="100" step="1" value="50">
  </div>
  <div class="control-row">
    <label>Fog (room)</label>
    <input type="range" id="fog-slider" min="0" max="100" step="1" value="0">
  </div>
  <div class="control-row">
    <label>Control Mode</label>
    <select id="control-mode" style="width:100%;background:#333;color:#ddd;border:1px solid #555;padding:4px;border-radius:4px;font-size:11px;">
      <option value="pan">Pan to Steer</option>
      <option value="joystick">Joystick</option>
    </select>
  </div>
  <div class="control-row">
    <label style="display:flex;align-items:center;gap:6px;font-size:11px;color:#aaa;"><input type="checkbox" id="invert-x"> Invert pan direction</label>
  </div>
  <div class="control-row">
    <label style="display:flex;align-items:center;gap:6px;font-size:11px;color:#aaa;"><input type="checkbox" id="show-names" checked> Show player names</label>
  </div>
  <hr style="border:none;border-top:1px solid #444;margin:12px 0;">
  <h3 style="margin-bottom:12px;color:#f0c040;font-size:14px;">TENT OPTIONS</h3>
  <div class="control-row">
    <label>Tent Color</label>
    <div id="tent-colors" style="display:flex;gap:4px;flex-wrap:wrap;">
      <button data-color="cc5522" style="background:#cc5522;width:24px;height:24px;border:2px solid #fff;border-radius:4px;cursor:pointer;"></button>
      <button data-color="2266aa" style="background:#2266aa;width:24px;height:24px;border:2px solid transparent;border-radius:4px;cursor:pointer;"></button>
      <button data-color="337733" style="background:#337733;width:24px;height:24px;border:2px solid transparent;border-radius:4px;cursor:pointer;"></button>
      <button data-color="aa2222" style="background:#aa2222;width:24px;height:24px;border:2px solid transparent;border-radius:4px;cursor:pointer;"></button>
      <button data-color="888888" style="background:#888888;width:24px;height:24px;border:2px solid transparent;border-radius:4px;cursor:pointer;"></button>
      <button data-color="ddaa22" style="background:#ddaa22;width:24px;height:24px;border:2px solid transparent;border-radius:4px;cursor:pointer;"></button>
      <button data-color="553388" style="background:#553388;width:24px;height:24px;border:2px solid transparent;border-radius:4px;cursor:pointer;"></button>
      <button data-color="222222" style="background:#222222;width:24px;height:24px;border:2px solid transparent;border-radius:4px;cursor:pointer;"></button>
      <button data-color="ee66aa" style="background:#ee66aa;width:24px;height:24px;border:2px solid transparent;border-radius:4px;cursor:pointer;"></button>
    </div>
  </div>
  <div class="control-row">
    <label>Tent Style</label>
    <select id="tent-style" style="width:100%;background:#333;color:#ddd;border:1px solid #555;padding:4px;border-radius:4px;font-size:11px;">
      <option value="aframe">A-Frame (2P)</option>
      <option value="dome">Dome (4P)</option>
      <option value="cabin">Tipi</option>
      <option value="tunnel">Tunnel (4P)</option>
    </select>
  </div>
</div>

<button id="btn-stand" style="display:none;position:fixed;bottom:100px;left:30px;z-index:101;padding:10px 16px;border:1px solid #f0c040;border-radius:8px;background:#252535;color:#fff;cursor:pointer;">Stand up</button>
<button id="camp-interaction" style="display:none;position:fixed;z-index:150;transform:translate(-50%,-100%);padding:6px 10px;border:1px solid #f0c040;border-radius:7px;background:rgba(25,25,40,0.95);color:#fff;font:14px system-ui,sans-serif;white-space:nowrap;cursor:pointer;"></button>
<div id="winter-actions" style="position:fixed;bottom:160px;left:24px;z-index:101;display:flex;flex-direction:column;align-items:flex-start;gap:8px;">
  <button id="btn-skates" class="winter-action" style="display:none;"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#ddd" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 19h14"/><path d="M2 19c0-3 2-5 6-5h4c2 0 4 1 4 3"/><path d="M16 17v-7c0-1-1-2-2-2h-1"/><path d="M10 8v2"/><path d="M6 10c0-2 2-4 4-4"/></svg></button>
  <button id="btn-aim" class="winter-action" style="display:none;"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#ddd" stroke-width="2"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="4"/><line x1="12" y1="2" x2="12" y2="6"/><line x1="12" y1="18" x2="12" y2="22"/><line x1="2" y1="12" x2="6" y2="12"/><line x1="18" y1="12" x2="22" y2="12"/></svg></button>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.164.1/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.164.1/examples/jsm/"
  }

</script>
<script type="module">
import * as THREE from 'three';
import { createWinter } from './winter.js?v=182';

// --- SCREEN MANAGEMENT & NETWORKING ---
const SIGNAL_SERVER = 'https://campout-server.fernando-eb7.workers.dev';
const DEBUG_MODE = new URLSearchParams(window.location.search).has('debug');
const URL_WORLD = new URLSearchParams(window.location.search).get('world')?.toLowerCase();

// Random camper name generator
const CAMPER_ADJECTIVES = ['Burly', 'Jolly', 'Rugged', 'Sleepy', 'Happy', 'Grumpy', 'Brave', 'Lucky', 'Dusty', 'Sunny', 'Rustic', 'Wandering', 'Cheerful', 'Mellow'];
const CAMPER_NAMES = ['Joe', 'Tom', 'Max', 'Sam', 'Jake', 'Pete', 'Lou', 'Ben', 'Gus', 'Hank', 'Duke', 'Ace', 'Red', 'Slim', 'Buck', 'Chip', 'Finn', 'Rex', 'Bo', 'Cal'];
function randomCamperName() {
  const adj = CAMPER_ADJECTIVES[Math.floor(Math.random() * CAMPER_ADJECTIVES.length)];
  const name = CAMPER_NAMES[Math.floor(Math.random() * CAMPER_NAMES.length)];
  return `${adj} ${name}`;
}

function formatWorldCode(code) {
  if (!code) return '';
  return code.match(/.{1,4}/g).join(' ');
}

// Session persistence
function saveSession() {
  if (!roomId || !localPlayerId) return;
  const session = {
    roomId,
    localPlayerId,
    playerName,
    lobbyTentColor,
    lobbyTentStyle,
    globeRotation: window.globeRotation ? { x: window.globeRotation.x, y: window.globeRotation.y, z: window.globeRotation.z, w: window.globeRotation.w } : null,
    cameraAngle: window.cameraAngle,
    campState: localCampState,
    environment: sharedEnvironment ? { winter: sharedEnvironment.winter, snowCover: sharedEnvironment.snowCover, snowfall: sharedEnvironment.snowfall } : null,
    savedAt: Date.now()
  };
  localStorage.setItem('campout-session', JSON.stringify(session));
}

function loadSession() {
  const saved = localStorage.getItem('campout-session');
  if (!saved) return null;
  const session = JSON.parse(saved);
  // Session expires after 1 hour
  if (Date.now() - session.savedAt > 3600000) {
    localStorage.removeItem('campout-session');
    return null;
  }
  return session;
}

function clearSession() {
  localStorage.removeItem('campout-session');
}

const mpLogs = [];
function mpLog(msg, debugOnly = false) {
  if (debugOnly && !DEBUG_MODE) return;
  console.log('[MP]', msg);
  if (!DEBUG_MODE) return;
  mpLogs.push(msg);
  if (mpLogs.length > 20) mpLogs.shift();
  const el = document.getElementById('mp-status');
  if (el) {
    el.textContent = mpLogs.slice(-5).join('\n');
    el.style.display = mpLogs.length > 0 ? 'block' : 'none';
  }
}
let roomId = null;
let worldSeed = null;
let playerName = 'Camper';
let lobbyTentColor = 'cc5522';
let lobbyTentStyle = 'aframe';
let autoEnterWorld = false;
let signalingWs = null;
let localPlayerId = null;
let multiplayerReady = false;
let turnRefreshTimer = null;
let heartbeatTimer = null;
let turnRefreshAt = 0;
let turnRefreshPending = false;
const peerConnections = Object.create(null);
const dataChannels = Object.create(null);
const pendingCandidates = Object.create(null);
const restartPending = new Set();
const restartTimes = new Map();
const restartTimers = new Map();
const makingOffers = new Set();
let localCampState = null;
const remoteCampStates = Object.create(null);
const peerColors = Object.create(null);
let sharedEnvironment = null;
let environmentSendTimer = null;
let roomClockOffset = 0;
function roomNow() { return Date.now() + roomClockOffset; }

function sharedHour() {
  if (!sharedEnvironment) return 12;
  const state = sharedEnvironment;
  return ((state.hour + (state.paused ? 0 : Math.max(0, roomNow() - state.at) / 1000 * state.rate)) % 24 + 24) % 24;
}

function publishEnvironment(changes) {
  sharedEnvironment = { ...sharedEnvironment, hour: sharedHour(), at: roomNow(), ...changes,
    revision: Math.max(roomNow(), (sharedEnvironment?.revision || 0) + 1), author: localPlayerId };
  if (window.applyEnvironment) window.applyEnvironment();
  if (!environmentSendTimer) environmentSendTimer = setTimeout(() => {
    environmentSendTimer = null;
    const message = JSON.stringify({ type: 'environment', state: sharedEnvironment });
    for (const dc of Object.values(dataChannels)) if (dc.readyState === 'open') dc.send(message);
  }, 100);
}

function validCampState(camp) {
  return camp === null || (camp && typeof camp === 'object' &&
    Array.isArray(camp.position) && camp.position.length === 3 &&
    camp.position.every(n => Number.isFinite(n) && Math.abs(n) <= 1) &&
    Math.abs(Math.hypot(...camp.position) - 1) < 0.001 &&
    ['aframe', 'dome', 'cabin', 'tunnel'].includes(camp.style) &&
    typeof camp.color === 'string' && /^[a-f0-9]{6}$/.test(camp.color) &&
    Array.isArray(camp.tent) && camp.tent.length === 2 && camp.tent.every(n => Number.isFinite(n) && Math.abs(n) <= 60) &&
    Number.isSafeInteger(camp.placedAt) && camp.placedAt > 0 &&
    typeof camp.sleeping === 'boolean');
}

function publishCampState() {
  const message = JSON.stringify({ type: 'camp', camp: localCampState });
  for (const dc of Object.values(dataChannels)) {
    if (dc.readyState === 'open') dc.send(message);
  }
  if (window.syncCamps) window.syncCamps();
}
window.__mp = { peerConnections, dataChannels, pendingCandidates, get signalingWs() { return signalingWs; }, get localPlayerId() { return localPlayerId; } };

function networkError(error) {
  console.error(error);
  showToast(error.message);
}

async function createRoom() {
  const button = document.getElementById('btn-create-room');
  button.disabled = true;
  try {
    const resp = await fetch(SIGNAL_SERVER + '/api/create', { method: 'POST', signal: AbortSignal.timeout(15000) });
    if (!resp.ok) throw new Error('World creation failed: HTTP ' + resp.status);
    const data = await resp.json();
    roomId = data.roomId;
    worldSeed = data.seed;
    showLobby();
  } finally {
    button.disabled = false;
  }
}

// Landing screen handlers
document.getElementById('btn-create-room').addEventListener('click', () => createRoom().catch(networkError));

document.getElementById('btn-join-room').addEventListener('click', async () => {
  const code = document.getElementById('input-room-code').value.trim().toLowerCase();
  if (!/^[a-f0-9]{12}$/.test(code)) {
    showToast('Enter the 12-character world code.');
    return;
  }
  const button = document.getElementById('btn-join-room');
  button.disabled = true;
  button.textContent = '...';
  const resp = await fetch(`${SIGNAL_SERVER}/api/room/${code}/exists`).catch(() => null);
  button.disabled = false;
  button.textContent = 'Join';
  if (!resp || !resp.ok) {
    showToast('World not found. Check the code and try again.');
    return;
  }
  roomId = code;
  worldSeed = null;
  showLobby();
});

document.getElementById('input-room-code').addEventListener('keydown', (e) => {
  if (e.key === 'Enter') document.getElementById('btn-join-room').click();
});

// Auto-join if world code in URL
if (URL_WORLD && /^[a-f0-9]{12}$/.test(URL_WORLD)) {
  (async () => {
    const resp = await fetch(`${SIGNAL_SERVER}/api/room/${URL_WORLD}/exists`).catch(() => null);
    if (!resp || !resp.ok) {
      showToast('World from URL not found. It may have expired.');
      return;
    }
    roomId = URL_WORLD;
    worldSeed = null;
    // Auto-enter if we have a saved session for this same world
    const savedSession = loadSession();
    if (savedSession && savedSession.roomId === URL_WORLD) {
      playerName = savedSession.playerName || 'Camper';
      lobbyTentColor = savedSession.lobbyTentColor || 'cc5522';
      lobbyTentStyle = savedSession.lobbyTentStyle || 'aframe';
      autoEnterWorld = true;
    }
    showLobby();
  })();
} else {
  // Auto-rejoin from saved session if no URL parameter
  const savedSession = loadSession();
  if (savedSession && savedSession.roomId) {
    (async () => {
      const resp = await fetch(`${SIGNAL_SERVER}/api/room/${savedSession.roomId}/exists`).catch(() => null);
      if (!resp || !resp.ok) {
        clearSession();
        return;
      }
      roomId = savedSession.roomId;
      worldSeed = null;
      playerName = savedSession.playerName || 'Camper';
      lobbyTentColor = savedSession.lobbyTentColor || 'cc5522';
      lobbyTentStyle = savedSession.lobbyTentStyle || 'aframe';
      autoEnterWorld = true;  // Skip lobby, go straight to game
      showLobby();
    })();
  }
}

// Lobby screen handlers
document.getElementById('btn-enter-world').addEventListener('click', () => {
  if (!multiplayerReady || worldSeed === null) return;
  document.getElementById('btn-enter-world').disabled = true;
  playerName = document.getElementById('input-player-name').value.trim() || 'Camper';
  document.getElementById('landing-screen').style.display = 'none';
  document.getElementById('lobby-screen').style.display = 'none';
  document.getElementById('game-screen').style.display = 'block';
  startGame(worldSeed);
});

document.querySelectorAll('#lobby-tent-colors button').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('#lobby-tent-colors button').forEach(b => b.style.borderColor = 'transparent');
    btn.style.borderColor = '#fff';
    lobbyTentColor = btn.dataset.color;
  });
});

document.getElementById('lobby-tent-style').addEventListener('change', (e) => {
  lobbyTentStyle = e.target.value;
});

document.getElementById('btn-copy-link').addEventListener('click', () => {
  const url = new URL(window.location.href);
  url.search = '';
  url.searchParams.set('world', roomId);
  navigator.clipboard.writeText(url.toString()).then(() => {
    const btn = document.getElementById('btn-copy-link');
    btn.textContent = 'Copied!';
    btn.style.borderColor = '#4a4';
    setTimeout(() => { btn.textContent = 'Copy Invite Link'; btn.style.borderColor = '#555'; }, 2000);
  });
});

function showLobby() {
  document.getElementById('landing-screen').style.display = 'none';
  document.getElementById('lobby-screen').style.display = 'flex';
  document.getElementById('lobby-room-id').textContent = formatWorldCode(roomId);
  document.getElementById('lobby-seed-display').textContent = 'Joining world...';
  document.getElementById('btn-enter-world').disabled = true;
  
  // Set random default name if not already set
  const nameInput = document.getElementById('input-player-name');
  if (!nameInput.value) {
    const session = loadSession();
    if (session && session.roomId === roomId && session.playerName) {
      nameInput.value = session.playerName;
      // Restore tent settings from session
      if (session.lobbyTentColor) {
        lobbyTentColor = session.lobbyTentColor;
        document.querySelectorAll('#lobby-tent-colors button').forEach(b => {
          b.style.borderColor = b.dataset.color === lobbyTentColor ? '#fff' : 'transparent';
        });
      }
      if (session.lobbyTentStyle) {
        lobbyTentStyle = session.lobbyTentStyle;
        document.getElementById('lobby-tent-style').value = lobbyTentStyle;
      }
    } else {
      nameInput.value = randomCamperName();
    }
  }
  
  connectSignaling();
}

function connectSignaling() {
  const wsUrl = SIGNAL_SERVER.replace('https://', 'wss://') + '/api/room/' + roomId;
  signalingWs = new WebSocket(wsUrl);

  signalingWs.addEventListener('open', () => {
    signalingWs.send(JSON.stringify({
      type: 'join',
      name: playerName || 'Camper',
      color: lobbyTentColor,
      tentStyle: lobbyTentStyle,
      tentColor: lobbyTentColor,
    }));
  });

  let messages = Promise.resolve();
  signalingWs.addEventListener('message', event => {
    messages = messages.then(async () => {
      const msg = JSON.parse(event.data);
      try {
        await handleSignalMessage(msg);
      } catch (error) {
        if (['offer', 'answer', 'ice-candidate'].includes(msg.type) && typeof msg.from === 'string') {
          console.error('Signaling error, removing peer:', msg.from, error);
          removePeerConnection(msg.from);
          networkError(error);
        } else {
          throw error;
        }
      }
    }).catch(error => {
      networkError(error);
      signalingWs.close(1000, 'Signaling processing failed');
    });
  });
  signalingWs.addEventListener('error', () => showToast('World connection failed. Check the code or wait a minute, then reload.'));
  signalingWs.addEventListener('close', event => {
    multiplayerReady = false;
    clearTimeout(turnRefreshTimer);
    clearInterval(heartbeatTimer);
    document.getElementById('btn-enter-world').disabled = true;
    for (const id of Object.keys(peerConnections)) removePeerConnection(id);
    
    // Auto-reconnect after 2 seconds if we were in-game
    if (document.getElementById('game-screen').style.display === 'block') {
      showToast('Connection lost. Reconnecting...');
      setTimeout(() => {
        if (!signalingWs || signalingWs.readyState === WebSocket.CLOSED) {
          connectSignaling();
        }
      }, 2000);
    } else {
      showToast('Disconnected: ' + (event.reason || 'connection lost') + '. Reload to rejoin.');
    }
  });
}

async function handleSignalMessage(msg) {
    if (msg.type === 'pong') return;
    mpLog('← ' + msg.type + (msg.from ? ' from:' + msg.from.substring(0,6) : '') + (msg.id ? ' id:' + msg.id.substring(0,6) : ''), true);
    switch (msg.type) {
      case 'room-info': {
        localPlayerId = msg.id;
        worldSeed = msg.seed;
        roomClockOffset = Number.isSafeInteger(msg.serverTime) ? msg.serverTime - Date.now() : 0;
        sharedEnvironment = { hour: 8 + (worldSeed % 800) / 100, at: roomNow(), rate: 0.04,
          paused: false, fog: 0, moonlight: 0.5, revision: 0, author: '',
          winter: false, snowCover: 0.75, snowfall: 0.4 };
        applyTurnCredentials(msg);
        signalingWs.send(JSON.stringify({ type: 'ready' }));
        break;
      }
      case 'ready': {
        multiplayerReady = true;
        document.getElementById('lobby-seed-display').textContent = 'seed: ' + worldSeed;
        document.getElementById('btn-enter-world').disabled = false;
        heartbeatTimer = setInterval(() => {
          if (signalingWs.readyState === WebSocket.OPEN) {
            signalingWs.send(JSON.stringify({ type: 'ping' }));
            refreshTurnIfDue();
          }
        }, 20000);
        
        // Clear "Reconnecting" message if we're already in game
        if (document.getElementById('game-screen').style.display === 'block') {
          mpLogs.length = 0;
          const el = document.getElementById('mp-status');
          if (el) el.style.display = 'none';
        }
        
        // Auto-enter world if restoring from session
        if (autoEnterWorld && worldSeed !== null) {
          autoEnterWorld = false;
          document.getElementById('landing-screen').style.display = 'none';
          document.getElementById('lobby-screen').style.display = 'none';
          document.getElementById('game-screen').style.display = 'block';
          startGame(worldSeed);
        }
        break;
      }
      case 'turn-creds': {
        applyTurnCredentials(msg);
        break;
      }
      case 'peer-joined': {
        peerColors[msg.id] = msg.color;
        updateLobbyPeers(msg);
        await createPeerConnection(msg.id, localPlayerId > msg.id);
        break;
      }
      case 'peer-left': {
        console.log('Signaling: peer-left received for', msg.id);
        removePeerConnection(msg.id);
        break;
      }
      case 'offer': {
        await handleOffer(msg);
        break;
      }
      case 'answer': {
        await handleAnswer(msg);
        break;
      }
      case 'ice-candidate': {
        await handleIceCandidate(msg);
        break;
      }
      case 'restart-request': {
        if (localPlayerId > msg.from) requestIceRestart(msg.from);
        break;
      }
    }
}

function updateLobbyPeers(msg) {
  const el = document.getElementById('lobby-peers');
  const existing = el.textContent;
  el.textContent = (existing ? existing + '\n' : '') + (msg.name || msg.id) + ' joined';
}

// --- WebRTC ---
const rtcConfig = { iceServers: [], iceTransportPolicy: 'all' };

function applyTurnCredentials(data) {
  rtcConfig.iceServers = data.iceServers;
  turnRefreshPending = false;
  turnRefreshAt = Date.now() + data.refreshAfterMs;
  clearTimeout(turnRefreshTimer);
  turnRefreshTimer = setTimeout(refreshTurnIfDue, data.refreshAfterMs);
  for (const [id, pc] of Object.entries(peerConnections)) {
    pc.setConfiguration(rtcConfig);
    if (localPlayerId > id) requestIceRestart(id);
    else signalingWs.send(JSON.stringify({ type: 'restart-request', target: id }));
  }
  mpLog('TURN credentials updated', true);
}

function refreshTurnIfDue() {
  if (!multiplayerReady || turnRefreshPending || Date.now() < turnRefreshAt || signalingWs.readyState !== WebSocket.OPEN) return;
  turnRefreshPending = true;
  signalingWs.send(JSON.stringify({ type: 'turn-refresh' }));
}

document.addEventListener('visibilitychange', () => {
  if (!document.hidden) refreshTurnIfDue();
});

function removePeerConnection(id) {
  console.log('removePeerConnection called for', id.substring(0,6), new Error().stack);
  delete peerColors[id];
  delete remoteCampStates[id];
  if (window.syncCamps) window.syncCamps();
  const pc = peerConnections[id];
  delete peerConnections[id];
  delete pendingCandidates[id];
  const dc = dataChannels[id];
  delete dataChannels[id];
  restartPending.delete(id);
  restartTimes.delete(id);
  clearTimeout(restartTimers.get(id));
  restartTimers.delete(id);
  if (dc) dc.close();
  if (pc) pc.close();
  if (window.removeOtherPlayer) window.removeOtherPlayer(id);
}

async function sendOffer(peerId, iceRestart = false) {
  const pc = peerConnections[peerId];
  makingOffers.add(peerId);
  try {
    const offer = await pc.createOffer({ iceRestart });
    await pc.setLocalDescription(offer);
    signalingWs.send(JSON.stringify({ type: 'offer', target: peerId, sdp: pc.localDescription }));
  } finally {
    makingOffers.delete(peerId);
  }
}

function requestIceRestart(peerId) {
  const pc = peerConnections[peerId];
  if (!pc || localPlayerId < peerId || signalingWs.readyState !== WebSocket.OPEN) return;
  restartPending.add(peerId);
  if (pc.signalingState !== 'stable' || makingOffers.has(peerId)) return;
  const delay = 10000 - (Date.now() - (restartTimes.get(peerId) || 0));
  if (delay > 0) {
    clearTimeout(restartTimers.get(peerId));
    restartTimers.set(peerId, setTimeout(() => requestIceRestart(peerId), delay));
    return;
  }
  restartPending.delete(peerId);
  restartTimes.set(peerId, Date.now());
  sendOffer(peerId, true).catch(networkError);
}

async function createPeerConnection(peerId, initiator) {
  if (peerConnections[peerId]) return peerConnections[peerId];
  mpLog('PC create: ' + peerId.substring(0,6) + (initiator ? ' (initiator)' : ''), true);
  const pc = new RTCPeerConnection(rtcConfig);
  peerConnections[peerId] = pc;
  pendingCandidates[peerId] ||= [];

  pc.onsignalingstatechange = () => {
    if (pc.signalingState === 'stable' && restartPending.has(peerId)) requestIceRestart(peerId);
  };

  pc.oniceconnectionstatechange = () => {
    mpLog('ICE: ' + pc.iceConnectionState + ' ' + peerId.substring(0,6), true);
    if (pc.iceConnectionState === 'failed' && signalingWs.readyState === WebSocket.OPEN) {
      if (localPlayerId > peerId) requestIceRestart(peerId);
      else signalingWs.send(JSON.stringify({ type: 'restart-request', target: peerId }));
    }
  };

  pc.onicecandidate = (event) => {
    if (event.candidate && signalingWs.readyState === WebSocket.OPEN) {
      signalingWs.send(JSON.stringify({
        type: 'ice-candidate',
        target: peerId,
        candidate: event.candidate,
      }));
    }
  };

  pc.ondatachannel = (event) => {
    setupDataChannel(peerId, event.channel);
  };

  if (initiator) {
    const dc = pc.createDataChannel('game');
    setupDataChannel(peerId, dc);
    await sendOffer(peerId);
  }

  return pc;
}

function setupDataChannel(peerId, channel) {
  dataChannels[peerId] = channel;
  channel.onopen = () => {
    mpLog('DC open: ' + peerId.substring(0,6), true);
    if (window.globeRotation) broadcastHello(window.globeRotation);
    channel.send(JSON.stringify({ type: 'camp', camp: localCampState }));
    if (sharedEnvironment) channel.send(JSON.stringify({ type: 'environment', state: sharedEnvironment }));
  };
  channel.onmessage = (event) => {
    // Basic sanity checks - just ignore bad messages, don't disconnect
    if (typeof event.data !== 'string' || event.data.length > 4096) {
      console.warn('Ignoring oversized or non-string message');
      return;
    }
    let data;
    try { data = JSON.parse(event.data); }
    catch (e) { console.warn('Ignoring unparseable message:', e.message); return; }
    if (data && data.type === 'environment') {
      const s = data.state;
      if (!s || !Number.isFinite(s.hour) || s.hour < 0 || s.hour >= 24 ||
          !Number.isSafeInteger(s.at) || s.at < 0 || ![0.04, 0.1].includes(s.rate) ||
          typeof s.paused !== 'boolean' || !Number.isFinite(s.fog) || s.fog < 0 || s.fog > 1 ||
          !Number.isFinite(s.moonlight) || s.moonlight < 0 || s.moonlight > 1 ||
          (s.winter !== undefined && typeof s.winter !== 'boolean') ||
          ['snowCover', 'snowfall'].some(key => s[key] !== undefined && (!Number.isFinite(s[key]) || s[key] < 0 || s[key] > 1)) ||
          !Number.isSafeInteger(s.revision) || s.revision < 0 || typeof s.author !== 'string' || s.author.length > 64) {
        console.warn('Ignoring bad environment message:', s);
        return;  // Just ignore, don't disconnect
      }
      const old = sharedEnvironment;
      if (!old || s.revision > old.revision || (s.revision === old.revision &&
          (s.author > old.author || (s.author === old.author && s.at < old.at)))) {
        sharedEnvironment = { hour: s.hour, at: s.at, rate: s.rate, paused: s.paused,
          fog: s.fog, moonlight: s.moonlight, revision: s.revision, author: s.author,
          winter: s.winter ?? false, snowCover: s.snowCover ?? 0.75, snowfall: s.snowfall ?? 0.4 };
        if (window.applyEnvironment) window.applyEnvironment();
        if (window.syncCamps) window.syncCamps();
      }
      return;
    }
    if (data && data.type === 'camp') {
      if (!validCampState(data.camp)) { console.warn('Ignoring bad camp message:', data.camp); return; }
      remoteCampStates[peerId] = data.camp === null ? null : {
        position: data.camp.position, style: data.camp.style,
        color: data.camp.color, sleeping: data.camp.sleeping, tent: data.camp.tent, placedAt: data.camp.placedAt,
      };
      if (window.syncCamps) window.syncCamps();
      return;
    }
    if (data?.type === 'snowball') {
      window.receiveSnowball?.(peerId, data);
      return;
    }
    if (data?.type === 'ice-contact') {
      window.receiveIceContact?.(peerId, data);
      return;
    }
    // Validate bump messages
    if (data && data.type === 'bump') {
      if (!Number.isFinite(data.dx) || !Number.isFinite(data.dz) || Math.abs(data.dx) > 1 || Math.abs(data.dz) > 1 ||
          (data.axis !== undefined && (!Array.isArray(data.axis) || data.axis.length !== 3 ||
            !data.axis.every(n => Number.isFinite(n) && Math.abs(n) <= 1) ||
            Math.abs(Math.hypot(...data.axis) - 1) > 0.01))) {
        console.warn('Ignoring bad bump message:', data);
        return;  // Just ignore, don't disconnect
      }
      handleGameMessage(peerId, data);
      return;
    }
    if (!data || !['hello', 'pos', 'bump'].includes(data.type)) {
      console.warn('Ignoring unknown message type:', data?.type);
      return;  // Just ignore unknown messages
    }
    if (['hello', 'pos'].includes(data.type)) {
      if (![data.qx, data.qy, data.qz, data.qw].every(n => Number.isFinite(n) && Math.abs(n) <= 1) ||
          Math.abs(Math.hypot(data.qx, data.qy, data.qz, data.qw) - 1) > 0.01 ||
          (data.type === 'pos' && !Number.isFinite(data.facing)) ||
          (data.type === 'hello' && !/^[a-f0-9]{6}$/.test(data.color)) ||
          (data.type === 'hello' && (typeof data.name !== 'string' || data.name.length > 20))) {
        console.warn('Ignoring bad pos/hello:', data);
        return;  // Just ignore, don't disconnect
      }
    }
    if (data.type === 'hello') mpLog('DC msg: hello from ' + peerId.substring(0,6), true);
    if (data.motion !== undefined) {
      const m = data.motion;
      if (!m || typeof m !== 'object' || !Number.isFinite(m.phase) || m.phase < 0 || m.phase > Math.PI * 2 ||
          ![0, 8, 12].includes(m.rate) || ![0.35, 0.5].includes(m.amplitude) || ![0.03, 0.04].includes(m.waddle) ||
          !Number.isFinite(m.swing) || Math.abs(m.swing) > 0.5 || !Number.isFinite(m.roll) || Math.abs(m.roll) > 0.1 ||
          typeof m.flashlight !== 'boolean' ||
          ['snowball', 'skating'].some(key => m[key] !== undefined && typeof m[key] !== 'boolean') ||
          (m.iceVelocity !== undefined && (!Array.isArray(m.iceVelocity) || m.iceVelocity.length !== 3 ||
            !m.iceVelocity.every(n => Number.isFinite(n) && Math.abs(n) <= 0.6) || Math.hypot(...m.iceVelocity) > 0.61))) {
        console.warn('Ignoring bad motion data:', m);
        data.motion = undefined;  // Strip bad motion, don't disconnect
      }
    }
    handleGameMessage(peerId, data);
  };
  channel.onclose = () => {
    console.log('Data channel closed for peer:', peerId.substring(0,6));
    mpLog('DC closed: ' + peerId.substring(0,6), true);
    if (dataChannels[peerId] === channel) {
      delete dataChannels[peerId];
      delete remoteCampStates[peerId];
      if (window.syncCamps) window.syncCamps();
    }
    if (window.removeOtherPlayer) window.removeOtherPlayer(peerId);
  };
}

async function handleOffer(msg) {
  let pc = peerConnections[msg.from];
  if (!pc) pc = await createPeerConnection(msg.from, false);
  mpLog('setRemoteDesc (offer) ' + msg.from.substring(0,6), true);
  await pc.setRemoteDescription(msg.sdp);
  mpLog('flushing ' + (pendingCandidates[msg.from] || []).length + ' pending ICE', true);
  for (const c of pendingCandidates[msg.from] || []) {
    await pc.addIceCandidate(c);
  }
  pendingCandidates[msg.from] = [];
  const answer = await pc.createAnswer();
  await pc.setLocalDescription(answer);
  signalingWs.send(JSON.stringify({
    type: 'answer',
    target: msg.from,
    sdp: answer,
  }));
}

async function handleAnswer(msg) {
  const pc = peerConnections[msg.from];
  if (pc) {
    await pc.setRemoteDescription(msg.sdp);
    for (const c of pendingCandidates[msg.from] || []) {
      await pc.addIceCandidate(c);
    }
    pendingCandidates[msg.from] = [];
  }
}

async function handleIceCandidate(msg) {
  const pc = peerConnections[msg.from];
  if (pc && pc.remoteDescription) {
    await pc.addIceCandidate(msg.candidate);
  } else {
    if (!pendingCandidates[msg.from]) pendingCandidates[msg.from] = [];
    if (pendingCandidates[msg.from].length >= 256) throw new Error('Too many pending ICE candidates');
    pendingCandidates[msg.from].push(msg.candidate);
  }
}

function handleGameMessage(peerId, msg) {
  if (typeof msg.color === 'string' && /^[a-f0-9]{6}$/.test(msg.color)) peerColors[peerId] = msg.color;
  const color = parseInt(peerColors[peerId] || remoteCampStates[peerId]?.color || 'cc5522', 16);
  // Handle bump message - other player is telling us we collided
  if (msg.type === 'bump') {
    if (window.receiveBump) window.receiveBump(peerId, msg);
    return;
  }
  if (msg.type === 'pos') {
    const q = new THREE.Quaternion(msg.qx, msg.qy, msg.qz, msg.qw);
    if (window.updateOtherPlayer) {
      if (!window.otherPlayers[peerId]) {
        window.addOtherPlayer(peerId, color, q);
      }
      window.updateOtherPlayer(peerId, q, msg.facing);
      if (msg.motion && window.setOtherPlayerMotion) window.setOtherPlayerMotion(peerId, msg.motion);
    }
  }
  if (msg.type === 'hello') {
    if (window.addOtherPlayer && !window.otherPlayers[peerId]) {
      window.addOtherPlayer(peerId, color, new THREE.Quaternion(msg.qx, msg.qy, msg.qz, msg.qw), msg.name || 'Camper');
    }
  }
  if (window.setOtherPlayerColor) window.setOtherPlayerColor(peerId, color);
}

function broadcastPosition(globeRot, facing, motion) {
  const msg = JSON.stringify({
    type: 'pos',
    color: window.getTentColor ? window.getTentColor() : lobbyTentColor,
    qx: globeRot.x, qy: globeRot.y, qz: globeRot.z, qw: globeRot.w,
    facing,
    motion,
  });
  for (const id in dataChannels) {
    const dc = dataChannels[id];
    if (dc.readyState === 'open' && dc.bufferedAmount < 65536) dc.send(msg);
  }
}

function broadcastHello(globeRot) {
  const msg = JSON.stringify({
    type: 'hello',
    color: window.getTentColor ? window.getTentColor() : lobbyTentColor,
    name: playerName || 'Camper',
    qx: globeRot.x, qy: globeRot.y, qz: globeRot.z, qw: globeRot.w,
  });
  for (const id in dataChannels) {
    const dc = dataChannels[id];
    if (dc.readyState === 'open' && dc.bufferedAmount < 65536) dc.send(msg);
  }
}

// Send bump notification to a specific peer
function sendBump(peerId, axis) {
  const dc = dataChannels[peerId];
  if (dc && dc.readyState === 'open') {
    // Legacy clients can play their reaction without interpreting a unit axis as a huge shove.
    dc.send(JSON.stringify({ type: 'bump', dx: 0, dz: 0, axis: [axis.x, axis.y, axis.z] }));
  }
}

function mulberry32(a) {
  return function() {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
const rng = mulberry32(seed);

// --- UTILITY: place on globe surface ---
function placeOnGlobe(obj, lat, lon, offset = 0) {
  const pos = latLonToWorld(lat, lon);
  const normal = pos.clone().normalize();
  obj.position.copy(pos).addScaledVector(normal, offset);
  const up = new THREE.Vector3(0, 1, 0);
  const quat = new THREE.Quaternion().setFromUnitVectors(up, normal);
  obj.quaternion.copy(quat);
}

function latLonToWorld(lat, lon) {
  const x = GLOBE_RADIUS * Math.cos(lat) * Math.cos(lon);
  const y = GLOBE_RADIUS * Math.sin(lat);
  const z = GLOBE_RADIUS * Math.cos(lat) * Math.sin(lon);
  return new THREE.Vector3(x, y, z);
}

function worldToLatLon(pos) {
  const n = pos.clone().normalize();
  const lat = Math.asin(n.y);
  const lon = Math.atan2(n.z, n.x);
  return { lat, lon };
}

function randomPointOnSphere() {

}

// --- RIVER ---
const riverPaths = [];

function buildRiver(startLat, startLon, endLat, endLon, segments) {
  const waterWidth = 1.2;
  const pathPoints = [];
  for (let i = 0; i <= segments; i++) {
    const t = i / segments;
    const lat = startLat + (endLat - startLat) * t + Math.sin(t * Math.PI * 6) * 0.2 + Math.sin(t * Math.PI * 14) * 0.08 + Math.sin(t * Math.PI * 3) * 0.12;
    const lon = startLon + (endLon - startLon) * t + Math.cos(t * Math.PI * 5) * 0.15 + Math.cos(t * Math.PI * 11) * 0.05 + Math.cos(t * Math.PI * 2.5) * 0.1;
    pathPoints.push({ lat, lon });
  }
  const maxGap = 0.15;
  const dense = [pathPoints[0]];
  for (let i = 1; i < pathPoints.length; i++) {
    const prev = pathPoints[i - 1];
    const cur = pathPoints[i];
    const a = latLonToWorld(prev.lat, prev.lon);
    const b = latLonToWorld(cur.lat, cur.lon);
    const dist = a.distanceTo(b);
    const subdivs = Math.max(1, Math.ceil(dist / maxGap));
    for (let s = 1; s <= subdivs; s++) {
      const t = s / subdivs;
      dense.push({ lat: prev.lat + (cur.lat - prev.lat) * t, lon: prev.lon + (cur.lon - prev.lon) * t });
    }
  }
  riverPaths.push({ points: dense, width: waterWidth });
}

// --- DEFORM GLOBE (hills, lake basins, river channels) ---
// Simple noise function for hills
function noise2D(x, y) {
  const n = Math.sin(x * 1.3 + y * 0.7) * 0.5 + Math.sin(x * 0.5 - y * 1.1) * 0.3 + Math.sin(x * 2.1 + y * 1.9) * 0.2;
  return n;
}

const globePos = globeGeo.attributes.position;
const vertCount = globePos.count;
const colors = new Float32Array(vertCount * 3);
const baseGreen = new THREE.Color(0x4a8c3f);
const sandColor = new THREE.Color(0xe8c870);
const waterLevel = [];

for (let v = 0; v < vertCount; v++) {
  const vx = globePos.getX(v);
  const vy = globePos.getY(v);
  const vz = globePos.getZ(v);
  const vertPos = new THREE.Vector3(vx, vy, vz);
  const vertNorm = vertPos.clone().normalize();

  // Hills: displace outward based on noise
  const hillAmount = noise2D(vx * 0.3, vz * 0.3) * 0.8 + noise2D(vx * 0.7, vy * 0.5) * 0.4;
  let displacement = Math.max(0, hillAmount) * 0.7;

  // One big foothill
  const foothillPos = latLonToWorld(-0.3, 2.5);
  const foothillDist = vertPos.distanceTo(foothillPos);
  const foothillRadius = 6.0;
  if (foothillDist < foothillRadius) {
    const t = 1 - foothillDist / foothillRadius;
    displacement += t * t * 5.0;
  }

  // Lake depressions: irregular shapes using noise-modulated radius
  let isWater = false;
  for (const lake of lakeData) {
    const lakePos = latLonToWorld(lake.lat, lake.lon);
    const dist = vertPos.distanceTo(lakePos);
    const angle = Math.atan2(vertPos.z - lakePos.z, vertPos.x - lakePos.x);
    const irregularRadius = lake.radius * (0.7 + 0.3 * Math.sin(angle * 3) + 0.15 * Math.sin(angle * 7 + 1));
    if (dist < irregularRadius) {
      const t = 1 - dist / irregularRadius;
      const depthScale = lake.radius > 4 ? 5.0 : 1.5;
      displacement = -depthScale * t * t;
      isWater = true;
    } else if (dist < irregularRadius + 0.6) {
      const t = 1 - (dist - irregularRadius) / 0.6;
      displacement = Math.min(displacement, -0.3 * t);
      isWater = false;
      colors[v * 3] = sandColor.r;
      colors[v * 3 + 1] = sandColor.g;
      colors[v * 3 + 2] = sandColor.b;
      continue;
    }
  }

  // River channels
  for (const river of riverPaths) {
    for (let i = 0; i < river.points.length; i++) {
      const rp = latLonToWorld(river.points[i].lat, river.points[i].lon);
      const dist = vertPos.distanceTo(rp);
      if (dist < river.width + 0.3) {
        const t = Math.max(0, 1 - dist / (river.width + 0.3));
        displacement = Math.min(displacement, -1.2 * t);
        if (dist < river.width) isWater = true;
      }
      if (dist < river.width + 0.6 && dist >= river.width + 0.3) {
        const t = 1 - (dist - river.width - 0.3) / 0.3;
        if (t > 0) {
          colors[v * 3] = baseGreen.r + (sandColor.r - baseGreen.r) * t;
          colors[v * 3 + 1] = baseGreen.g + (sandColor.g - baseGreen.g) * t;
          colors[v * 3 + 2] = baseGreen.b + (sandColor.b - baseGreen.b) * t;
          continue;
        }
      }
    }
  }

  const newPos = vertPos.clone().addScaledVector(vertNorm, displacement);
  globePos.setXYZ(v, newPos.x, newPos.y, newPos.z);

  if (isWater) {
    colors[v * 3] = sandColor.r * 0.85;
    colors[v * 3 + 1] = sandColor.g * 0.85;
    colors[v * 3 + 2] = sandColor.b * 0.5;
  } else if (colors[v * 3] === 0) {
    const hillTint = Math.max(0, hillAmount) * 0.15;
    colors[v * 3] = baseGreen.r + hillTint * 0.3;
    colors[v * 3 + 1] = baseGreen.g + hillTint;
    colors[v * 3 + 2] = baseGreen.b + hillTint * 0.2;
  }

  waterLevel.push(isWater);
}

globeGeo.setAttribute('color', new THREE.BufferAttribute(colors, 3));
globeMat.vertexColors = true;

// Mobile targeting joystick - snowball button becomes a joystick when holding a snowball
let targetingTouch = null;
const snowballBtn = document.getElementById('btn-snowball');
snowballBtn.addEventListener('touchstart', e => {
  if (!winter.holding) return; // Not holding snowball - let click handler do normal action
  e.preventDefault();
  e.stopPropagation();
  const touch = e.changedTouches[0];
  targetingTouch = {
    id: touch.identifier,
    startX: touch.clientX,
    startY: touch.clientY,
    lastX: touch.clientX,
    lastY: touch.clientY,
    startPower: winter.power,
    startCameraAngle: cameraAngle
  };
  winter.setAim(true);
}, { passive: false });
snowballBtn.addEventListener('touchmove', e => {
  if (!targetingTouch) return;
  e.preventDefault();
  for (const touch of e.changedTouches) {
    if (touch.identifier !== targetingTouch.id) continue;
    const dx = touch.clientX - targetingTouch.lastX;
    const dy = touch.clientY - targetingTouch.lastY;
    // Horizontal drag rotates player AND camera together (like pan mode)
    // This changes aimYaw (which sets playerFacing) and cameraAngle in sync
    if (Math.abs(dx) > 1) {
      const turn = dx * 0.012 * (invertX ? -1 : 1);
      winter.turnAim(turn);  // Rotate the aim direction (and thus player)
      cameraAngle += turn;   // Rotate camera to match
      cameraTargetAngle = cameraAngle;
    }
    // Vertical drag adjusts power (drag up = more power, drag down = less)
    if (Math.abs(dy) > 1) {
      const totalDy = targetingTouch.startY - touch.clientY;
      const powerRange = winter.powerMax - winter.powerMin;
      const newPower = targetingTouch.startPower + (totalDy / 150) * powerRange;
      winter.setPower(newPower);
    }
    targetingTouch.lastX = touch.clientX;
    targetingTouch.lastY = touch.clientY;
  }
}, { passive: false });
snowballBtn.addEventListener('touchend', e => {
  if (!targetingTouch) return;
  for (const touch of e.changedTouches) {
    if (touch.identifier !== targetingTouch.id) continue;
    e.preventDefault();
    // Throw the snowball
    winter.action();
    winter.setAim(false);
    targetingTouch = null;
  }
});
snowballBtn.addEventListener('touchcancel', () => {
  if (targetingTouch) {
    winter.setAim(false);
    targetingTouch = null;
  }
});

// --- PLAYER TERRAIN FOLLOWING ---
const raycaster = new THREE.Raycaster();

// The same radial depth test works anywhere on the planet, for all campers.
function updateSwimming(mesh, terrainRadius, moving, delta, winterSurface = null) {
  const state = mesh.userData;
  if (winterSurface?.enabled) {
    state.swimming = false;
    state.swimBlend = 0;
    state.onIce = terrainRadius < winterSurface.iceRadius;
    return Math.max(terrainRadius, winterSurface.iceRadius) + (state.skating ? 0.07 : 0);
  }
  state.onIce = false;
  const depth = WATER_RADIUS - terrainRadius;
  // Hysteresis keeps tiny shoreline changes from toggling the stroke each frame.
  state.swimming = depth > (state.swimming ? SWIM_DEPTH - 0.1 : SWIM_DEPTH);
  const blend = 1 - Math.exp(-8 * delta);
  state.swimBlend = THREE.MathUtils.lerp(state.swimBlend || 0, state.swimming ? 1 : 0, blend);
  state.swimMoving = THREE.MathUtils.lerp(state.swimMoving || 0, moving ? 1 : 0, blend);
  state.swimPhase = ((state.swimPhase || 0) + delta * (3 + 4 * state.swimMoving)) % (Math.PI * 2);
  const bob = Math.sin(state.swimPhase * 2) * 0.025 * state.swimBlend;
  // Compensate for the lean around shoulder height, keeping the water at the shoulders.
  const lean = 0.85 * state.swimMoving * state.swimBlend;
  const floatRadius = WATER_RADIUS - SWIM_DEPTH + 0.78 * (1 - Math.cos(lean)) + bob;
  return Math.max(terrainRadius, floatRadius);
}

function resetSwimLimbs(mesh) {
  mesh.userData.leftArm.rotation.z = 0.15;
  mesh.userData.rightArm.rotation.z = -0.15;
  mesh.userData.leftLeg.rotation.z = 0;
  mesh.userData.rightLeg.rotation.z = 0;
}

// Blend over the ordinary walking pose so entering/leaving water stays fluid.
function applySwimPose(mesh) {
  const s = mesh.userData;
  const weight = s.swimBlend || 0;
  if (weight < 0.001) return;
  const phase = s.swimPhase;
  const moving = s.swimMoving;
  mesh.rotateX(0.85 * moving * weight);
  mesh.rotateZ(Math.sin(phase) * 0.045 * weight * (1 - moving));
  // Both arms reach together, pull back slowly, then recover forward quickly.
  const cycle = phase / (Math.PI * 2);
  const pulling = cycle < 0.7;
  const strokeProgress = pulling ? cycle / 0.7 : (cycle - 0.7) / 0.3;
  const easedStroke = (1 - Math.cos(strokeProgress * Math.PI)) / 2;
  const paddle = pulling
    ? THREE.MathUtils.lerp(-2.4, 0.45, easedStroke)
    : THREE.MathUtils.lerp(0.45, -2.4, easedStroke);
  const recoverySpread = pulling ? 0 : Math.sin(strokeProgress * Math.PI) * 0.75;
  for (const [side, sign] of [['left', 1], ['right', -1]]) {
    const arm = s[side + 'Arm'];
    const leg = s[side + 'Leg'];
    const stroke = phase + (sign < 0 ? Math.PI : 0);
    const tread = -0.25 + Math.sin(stroke) * 0.3;
    arm.rotation.x = THREE.MathUtils.lerp(arm.rotation.x, THREE.MathUtils.lerp(tread, paddle, moving), weight);
    const armSpread = THREE.MathUtils.lerp(0.65 + Math.cos(stroke) * 0.1, 0.15 + recoverySpread, moving);
    arm.rotation.z = THREE.MathUtils.lerp(sign * 0.15, sign * armSpread, weight);
    leg.rotation.x = THREE.MathUtils.lerp(leg.rotation.x, Math.sin(stroke) * (0.22 + moving * 0.25), weight);
    leg.rotation.z = sign * (0.12 + Math.cos(stroke) * 0.06) * weight;
  }
}

// --- PLAYER ---
let playerFacing = 0;
let walkCycle = 0;
let playerBounceState = null;
const BUMP_DURATION = 0.62;
const BUMP_TRAVEL_TIME = 0.28;
const BUMP_DISTANCE = 0.32;
const bumpCooldowns = new Map();

// Axis is in the shared globe frame, never the sender's camera/player frame.
function startPlayerBump(peerId, axis, notify) {
  const p = otherPlayers[peerId];
  if (winter.collide(peerId)) return;
  const now = performance.now();
  if (!p || isSleeping || sittingFireId !== null || p.motion?.sitting || remoteCampStates[peerId]?.sleeping || playerBounceState ||
      now < (bumpCooldowns.get(peerId) || 0)) return;
  bumpCooldowns.set(peerId, now + 850);
  winter.stop();
  playerBounceState = { elapsed: 0, axis: axis.clone() };
  p.bump = { elapsed: 0, axis: axis.clone().negate() };
  walkingToTent = false;
  if (notify) sendBump(peerId, axis.clone().negate());
}

window.receiveBump = function(peerId, msg) {
  const p = otherPlayers[peerId];
  if (!p) return;
  const otherDir = new THREE.Vector3(0, 1, 0)
    .applyQuaternion(p.currentGlobeRotation.clone().invert()).applyQuaternion(globeRotation);
  if (otherDir.distanceTo(new THREE.Vector3(0, 1, 0)) * GLOBE_RADIUS > 1.5) return;
  // Older clients sent view-relative dx/dz; derive their contact normal instead.
  const axis = msg.axis === undefined
    ? new THREE.Vector3(otherDir.z, 0, -otherDir.x).normalize().applyQuaternion(globeRotation.clone().invert())
    : new THREE.Vector3(...msg.axis).normalize();
  if (axis.lengthSq() > 0.5) startPlayerBump(peerId, axis, false);
};

function bumpTravel(elapsed) {
  const t = Math.min(1, Math.max(0, elapsed / BUMP_TRAVEL_TIME));
  return 1 - Math.pow(1 - t, 3);
}

// Apply after the ordinary pose is rebuilt, so wobble never accumulates.
function applyBumpPose(mesh, bump, rotation) {
  if (!bump) return;
  const t = Math.min(1, bump.elapsed / BUMP_DURATION);
  const envelope = Math.sin(Math.PI * t) * (1 - t);
  const waddle = Math.sin(t * Math.PI * 3) * envelope * 0.5;
  const up = mesh.position.clone().normalize();
  const axis = bump.axis.clone().applyQuaternion(rotation);
  const away = new THREE.Vector3().crossVectors(up, axis).normalize()
    .applyQuaternion(mesh.quaternion.clone().invert());
  const hopT = Math.min(1, bump.elapsed / BUMP_TRAVEL_TIME);
  mesh.position.addScaledVector(up, Math.sin(Math.PI * hopT) * 0.13);
  mesh.rotateX(away.z * envelope * 0.25);
  mesh.rotateZ(-away.x * envelope * 0.25 + waddle * 0.24);
  mesh.scale.set(1 + envelope * 0.06, 1 - envelope * 0.1, 1 + envelope * 0.06);
  mesh.userData.leftLeg.rotation.x = waddle * 0.65;
  mesh.userData.rightLeg.rotation.x = -waddle * 0.65;
  mesh.userData.leftArm.rotation.x = -waddle * 0.45;
  mesh.userData.rightArm.rotation.x = waddle * 0.45;
}

function createNameLabel(name, color = '#00ff00') {
  const canvas = document.createElement('canvas');

  ctx.font = '100 28px system-ui, sans-serif';

const otherPlayers = {};

function addOtherPlayer(id, color, startGlobeRotation, name) {
  if (otherPlayers[id]) return otherPlayers[id];
  showToast(`${name || 'Camper'} joined the world`);
  const mesh = buildPlayer();
  mesh.traverse(c => { if (c.isMesh && c.material) { c.material = c.material.clone(); } });
  mesh.traverse(c => { if (c.isMesh && c.material?.userData.playerTint) c.material.color.set(color); });
  scene.add(mesh);
  const torch = new THREE.SpotLight(0xffffff, 0, 25, Math.PI * 0.08, 0.15, 0.5);
  torch.castShadow = true;
  torch.shadow.mapSize.set(512, 512);
  const torchTip = new THREE.Mesh(new THREE.SphereGeometry(0.045, 6, 4), new THREE.MeshBasicMaterial({ color: 0xffffff }));
  torchTip.visible = false;
  scene.add(torch, torch.target, torchTip);
  const nameLabel = createNameLabel(name || 'Camper');
  scene.add(nameLabel);
  otherPlayers[id] = {
    mesh,
    torch, torchTip, motion: null, motionReceivedAt: 0,
    color,
    name: name || 'Camper',
    nameLabel,
    currentGlobeRotation: startGlobeRotation.clone(),
    targetGlobeRotation: startGlobeRotation.clone(),
    prevGlobeRotation: startGlobeRotation.clone(),
    currentFacing: 0,
    targetFacing: 0,
    prevFacing: 0,
    interpT: 1,
    lastUpdateTime: performance.now(),
    walkCycle: 0,
    isWalking: false,
  };
  return otherPlayers[id];
}

function removeOtherPlayer(id) {
  mpLog('REMOVING player ' + id.substring(0,6));
  const p = otherPlayers[id];
  if (!p) return;
  scene.remove(p.mesh);
  scene.remove(p.torch, p.torch.target, p.torchTip);
  scene.remove(p.nameLabel);
  p.torch.shadow.dispose();
  p.torchTip.geometry.dispose();
  p.torchTip.material.dispose();
  p.nameLabel.material.map.dispose();
  p.nameLabel.material.dispose();
  delete otherPlayers[id];
  bumpCooldowns.delete(id);
}

function updateOtherPlayer(id, globeRotation, facing, immediate) {
  const p = otherPlayers[id];
  if (!p) return;
  if (immediate) {
    p.prevGlobeRotation.copy(globeRotation);
    p.currentGlobeRotation.copy(globeRotation);
    p.targetGlobeRotation.copy(globeRotation);
    p.currentFacing = facing;
    p.targetFacing = facing;
    p.prevFacing = facing;
    p.interpT = 1;
    p.isWalking = true;
    return;
  }
  p.prevGlobeRotation.copy(p.currentGlobeRotation);
  p.targetGlobeRotation.copy(globeRotation);
  p.prevFacing = p.currentFacing;
  p.targetFacing = facing;
  p.interpT = 0;
  p.isWalking = p.targetGlobeRotation.angleTo(p.prevGlobeRotation) > 0.0001;
  p.lastUpdateTime = performance.now();
}

function animateOtherPlayers(delta) {
  const INTERP_DURATION = 0.1;
  globePivot.updateMatrixWorld(true);
  for (const id in otherPlayers) {
    const p = otherPlayers[id];
    const m = p.mesh;
    m.scale.setScalar(1);
    const wasVisible = m.visible;
    m.visible = !remoteCampStates[id]?.sleeping;
    if (wasVisible && !m.visible) mpLog('Player ' + id.substring(0,6) + ' now invisible (sleeping=' + remoteCampStates[id]?.sleeping + ')');
    if (!wasVisible && m.visible) mpLog('Player ' + id.substring(0,6) + ' now visible');

    p.interpT = Math.min(p.interpT + delta / INTERP_DURATION, 1);
    p.currentGlobeRotation.slerpQuaternions(p.prevGlobeRotation, p.targetGlobeRotation, p.interpT);

    let facingDiff = p.targetFacing - p.prevFacing;
    if (facingDiff > Math.PI) facingDiff -= 2 * Math.PI;
    if (facingDiff < -Math.PI) facingDiff += 2 * Math.PI;
    p.currentFacing = p.prevFacing + facingDiff * p.interpT;

    const gDir = new THREE.Vector3(0, 1, 0).applyQuaternion(p.currentGlobeRotation.clone().invert());
    const wDir = gDir.applyQuaternion(globeRotation);

    const rayOrigin = wDir.clone().multiplyScalar(GLOBE_RADIUS + 10);
    const rayD = wDir.clone().negate();
    const ray = new THREE.Raycaster(rayOrigin, rayD, 0, GLOBE_RADIUS * 3);
    const hits = ray.intersectObject(globe, false);
    if (hits.length > 0) {
      m.position.copy(hits[0].point);
    } else {
      m.position.copy(wDir.clone().multiplyScalar(GLOBE_RADIUS));
    }
    // Debug: check for bad position
    if (!Number.isFinite(m.position.x) || m.position.length() < 1) {
      mpLog('BAD POS for ' + id.substring(0,6) + ': ' + m.position.toArray().map(n => n.toFixed(2)).join(','));
    }

    m.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), wDir);
    const fwdLocal = new THREE.Vector3(Math.sin(p.currentFacing), 0, Math.cos(p.currentFacing));
    const fwdGlobe = fwdLocal.applyQuaternion(p.currentGlobeRotation.clone().invert());
    const fwdWorld = fwdGlobe.applyQuaternion(globeRotation);
    fwdWorld.addScaledVector(wDir, -fwdWorld.dot(wDir));
    fwdWorld.normalize();
    const localFwd = fwdWorld.clone().applyQuaternion(m.quaternion.clone().invert());
    const fAngle = Math.atan2(localFwd.x, localFwd.z);
    m.rotateY(fAngle);

    const motionAge = (performance.now() - p.motionReceivedAt) / 1000;
    m.userData.skating = winter.enabled && !!p.motion?.skating && motionAge < 2;
    const swimmingMoving = motionAge < 0.5 && p.motion
      ? (p.motion.moving ?? p.motion.rate > 0)
      : p.isWalking && p.interpT < 1;
    const swimRadius = updateSwimming(m, m.position.length(), swimmingMoving, delta, winter);
    m.position.copy(wDir).multiplyScalar(swimRadius);
    resetSwimLimbs(m);
    const torchOn = !!p.motion?.flashlight && m.visible && motionAge < 2;
    p.torch.visible = torchOn;
    p.torch.intensity = torchOn ? 15 : 0;
    p.torchTip.visible = false;
    m.userData.flashlightStick.visible = torchOn;
    m.userData.flashlightLens.material.color.setHex(torchOn ? 0xffffcc : 0x333333);
    if (torchOn) {
      const lensWorld = new THREE.Vector3();
      m.userData.flashlightLens.getWorldPosition(lensWorld);
      p.torch.position.copy(lensWorld);
      p.torch.target.position.copy(new THREE.Vector3(0, -0.5, 5).applyQuaternion(m.quaternion).add(m.position));
    }

    if (p.motion) {
      const pose = p.motion;
      const age = Math.min(motionAge, 0.25);
      const phase = pose.phase + pose.rate * age;
      const swing = pose.rate ? Math.sin(phase) * pose.amplitude : pose.swing * Math.pow(0.85, age * 30);
      const roll = pose.rate ? Math.sin(phase) * pose.waddle : pose.roll * Math.pow(0.9, age * 30);
      m.userData.leftLeg.rotation.x = swing;
      m.userData.rightLeg.rotation.x = -swing;
      m.userData.leftArm.rotation.x = -swing * 0.4;
      m.userData.rightArm.rotation.x = swing * 0.4;
      m.rotateZ(roll);
    } else if (p.isWalking && p.interpT < 1) {
      p.walkCycle += delta * 8;
      const swing = Math.sin(p.walkCycle) * 0.5;
      m.userData.leftLeg.rotation.x = swing;
      m.userData.rightLeg.rotation.x = -swing;
      m.userData.leftArm.rotation.x = -swing * 0.4;
      m.userData.rightArm.rotation.x = swing * 0.4;
      m.rotateZ(Math.sin(p.walkCycle) * 0.04);
    } else {
      p.walkCycle = 0;
      m.userData.leftLeg.rotation.x *= 0.85;
      m.userData.rightLeg.rotation.x *= 0.85;
      m.userData.leftArm.rotation.x *= 0.85;
      m.userData.rightArm.rotation.x *= 0.85;
    }

    if (p.motion?.sitting && m.visible) applySitPose(m);
    else applySwimPose(m);

    if (p.bump) {
      p.bump.elapsed = Math.min(BUMP_DURATION, p.bump.elapsed + delta);
      applyBumpPose(m, p.bump, globeRotation);
      if (p.bump.elapsed >= BUMP_DURATION) p.bump = null;
    }

    // Position name label below player or at tent if sleeping
    const isSleepingInTent = remoteCampStates[id]?.sleeping;
    p.nameLabel.visible = showNameLabels;
    if (p.nameLabel.visible) {
      if (isSleepingInTent) {
        const tentModel = campModels.get(id);
        if (tentModel?.tent) {
          const tentWorld = new THREE.Vector3();
          tentModel.tent.getWorldPosition(tentWorld);
          p.nameLabel.position.copy(tentWorld).add(new THREE.Vector3(0, -0.5, 0));
        }
      } else {
        p.nameLabel.position.copy(m.position).addScaledVector(wDir, -0.3);
      }
      // Clamp scale based on distance to camera
      const dist = camera.position.distanceTo(p.nameLabel.position);
      const baseScale = 0.4;
      const scale = Math.max(0.75, Math.min(1.5, dist * 0.15)) * baseScale;
      p.nameLabel.scale.set(scale * 3, scale * 0.75, 1);
    }
  }
}

let leverY = 0, leverX = 0, leverActive = false, leverTouchId = null;
let controlMode = 'pan';
let invertX = false;

const leverRange = 10;
const joystickRange = 20;

document.getElementById('control-mode').addEventListener('change', (e) => {

  document.getElementById('joystick-base').style.display = controlMode === 'joystick' ? 'block' : 'none';

leverZone.addEventListener('touchstart', (e) => {
  e.preventDefault();
  if (isSleeping) return;
  leverTouchId = e.changedTouches[0].identifier;
  leverActive = true;
  updateLever(e.changedTouches[0]);
});
leverZone.addEventListener('touchmove', (e) => {
  e.preventDefault();
  for (const t of e.changedTouches) {
    if (t.identifier === leverTouchId) updateLever(t);
  }
});
leverZone.addEventListener('touchend', (e) => {
  for (const t of e.changedTouches) {
    if (t.identifier === leverTouchId) {
      leverActive = false;
      leverTouchId = null;
      leverY = 0;
      leverX = 0;
      leverZone.style.transform = '';
    }
  }
});

function updateLever(touch) {
  const rect = document.getElementById('lever-wrapper').getBoundingClientRect();
  const cx = rect.left + rect.width / 2;
  const cy = rect.top + rect.height / 2;
  let dy = touch.clientY - cy;
  let dx = touch.clientX - cx;
  // Walking lever is always vertical-only in pan mode (aiming doesn't change this)
  if (controlMode === 'pan') {
    if (dy > leverRange) dy = leverRange;
    if (dy < -leverRange) dy = -leverRange;
    leverY = dy / leverRange;
    leverX = 0;
    leverZone.style.transform = `translateY(${dy}px)`;
  } else {
    const dist = Math.sqrt(dx * dx + dy * dy);
    const maxDist = joystickRange;
    if (dist > maxDist) { dx = dx / dist * maxDist; dy = dy / dist * maxDist; }
    const rawX = dx / maxDist;
    const rawY = dy / maxDist;
    // Dead zone: only ignore left/right if X movement is tiny (< 3px)
    if (Math.abs(dx) > 3) {
      leverX = rawX;
    } else {
      leverX = 0;
    }
    leverY = rawY;
    leverZone.style.transform = `translate(${dx}px, ${dy}px)`;
  }
}

let pinchStartAvgX = null;
let pinchStartAngle = null;

// Mouse/touch drag to orbit camera
let isDragging = false;
let dragStartX = 0;
let dragStartY = 0;
let dragStartAngle = 0;
let dragStartHeight = 0;

renderer.domElement.addEventListener('contextmenu', (e) => e.preventDefault());
renderer.domElement.addEventListener('mousedown', (e) => {
  if (e.target !== renderer.domElement) return;
  if (winter.aiming) return;
  isDragging = true;
  dragStartX = e.clientX;
  dragStartAngle = cameraAngle;
  dragStartY = e.clientY;
  dragStartHeight = cameraHeight;
});
window.addEventListener('mousemove', (e) => {
  if (winter.aiming && lastInputMode === 'keyboard') {
    winter.turnAim(e.movementX * 0.006 * (invertX ? -1 : 1));
    winter.adjustAim(-e.movementY * 0.004);
    return;
  }
  if (!isDragging) return;
  const dx = e.clientX - dragStartX;
  const dy = e.clientY - dragStartY;
  cameraAngle = dragStartAngle + dx * 0.01 * (invertX ? -1 : 1);
  cameraTargetAngle = cameraAngle;
  cameraHeight = Math.max(1, Math.min(12, dragStartHeight + dy * 0.02));
});
window.addEventListener('mouseup', () => { isDragging = false; });

// Touch orbit (single finger on canvas, not joystick)
let orbitTouchId = null;
let orbitStartX = 0;
let orbitStartY = 0;
let orbitStartAngle = 0;
let orbitStartHeight = 0;

renderer.domElement.addEventListener('touchstart', (e) => {
  if (e.touches.length === 1 && !leverActive) {
    const touch = e.touches[0];
    const joyRect = document.getElementById('lever-zone').getBoundingClientRect();
    if (touch.clientX > joyRect.right || touch.clientY < joyRect.top) {
      orbitTouchId = touch.identifier;
      orbitStartX = touch.clientX;
      orbitStartY = touch.clientY;
      orbitStartAngle = cameraAngle;
      orbitStartHeight = cameraHeight;
    }
  }
  // When lever is active and a NEW touch lands on the canvas, use it for orbit
  if (leverActive && e.changedTouches.length > 0 && orbitTouchId === null) {
    for (const touch of e.changedTouches) {
      if (touch.identifier !== leverTouchId) {
        orbitTouchId = touch.identifier;
        orbitStartX = touch.clientX;
        orbitStartY = touch.clientY;
        orbitStartAngle = cameraAngle;
        orbitStartHeight = cameraHeight;
        break;
      }
    }
  }
  if (e.touches.length === 2 && !leverActive) {
    const dx = e.touches[0].clientX - e.touches[1].clientX;
    const dy = e.touches[0].clientY - e.touches[1].clientY;
    pinchStartDist = Math.sqrt(dx * dx + dy * dy);
    pinchStartZoom = cameraDistance;
    pinchStartAvgY = (e.touches[0].clientY + e.touches[1].clientY) / 2;
    pinchStartHeight = cameraHeight;
    pinchStartAvgX = (e.touches[0].clientX + e.touches[1].clientX) / 2;
    pinchStartAngle = cameraAngle;
  }
});
renderer.domElement.addEventListener('touchmove', (e) => {
  if (e.touches.length === 2 && pinchStartDist && !leverActive) {
    e.preventDefault();
    const dx = e.touches[0].clientX - e.touches[1].clientX;
    const dy = e.touches[0].clientY - e.touches[1].clientY;
    const dist = Math.sqrt(dx * dx + dy * dy);
    const scale = pinchStartDist / dist;
    cameraDistance = Math.max(4, Math.min(60, pinchStartZoom * scale));
    // Pan via midpoint horizontal movement
    const avgX = (e.touches[0].clientX + e.touches[1].clientX) / 2;
    cameraAngle = pinchStartAngle + (avgX - pinchStartAvgX) * 0.01 * (invertX ? -1 : 1);
    cameraTargetAngle = cameraAngle;
    // Tilt only with deliberate two-finger vertical drag (avgY moved > 30px)
    const avgY = (e.touches[0].clientY + e.touches[1].clientY) / 2;
    const tiltDelta = avgY - pinchStartAvgY;
    if (Math.abs(tiltDelta) > 30) {
      cameraHeight = Math.max(1, Math.min(12, pinchStartHeight + (tiltDelta - Math.sign(tiltDelta) * 30) * 0.03));
    }
    return;
  }
  for (const touch of e.changedTouches) {
    if (touch.identifier === orbitTouchId) {
      if (winter.aiming) {
        winter.turnAim((touch.clientX - orbitStartX) * 0.006 * (invertX ? -1 : 1));
        winter.adjustAim((orbitStartY - touch.clientY) * 0.004);
        orbitStartX = touch.clientX; orbitStartY = touch.clientY;
        continue;
      }
      const dx = touch.clientX - orbitStartX;
      cameraAngle = orbitStartAngle + dx * 0.01 * (invertX ? -1 : 1);
      cameraTargetAngle = cameraAngle;
    }
  }
});
renderer.domElement.addEventListener('touchend', (e) => {
  for (const touch of e.changedTouches) {
    if (touch.identifier === orbitTouchId) orbitTouchId = null;
  }
  if (e.touches.length < 2) {
    pinchStartDist = null; pinchStartAvgY = null; pinchStartAvgX = null;
    // Reset orbit tracking to remaining finger to prevent snap
    if (e.touches.length === 1 && !leverActive) {
      const remaining = e.touches[0];
      orbitTouchId = remaining.identifier;
      orbitStartX = remaining.clientX;
      orbitStartY = remaining.clientY;
      orbitStartAngle = cameraAngle;
      orbitStartHeight = cameraHeight;
    }
  }
});
